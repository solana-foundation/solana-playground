[package]
name = "solana-playground-utils-wasm"
version = "0.1.0"
description = "WASM utils for Solana Playground."
authors = ["Acheron <acheroncrypto@gmail.com>"]
repository = "https://github.com/solana-playground/solana-playground"
license = "Apache-2.0"
homepage = "https://beta.solpg.io"
edition = "2021"
keywords = ["solana", "playground", "wasm"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["js"]
js = []
# The built-in wallet as a CLI signer; pulls in the Solana SDK, so only the CLIs
# that sign enable it
wallet = ["js", "js-sys", "solana-client-wasm", "solana-sdk", "wasm-bindgen-futures"]

[dependencies]
js-sys = { version = "0.3.69", optional = true }
solana-client-wasm = { path = "../../solana-client", optional = true }
solana-sdk = { version = "~1.18", optional = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { version = "0.4.38", optional = true }