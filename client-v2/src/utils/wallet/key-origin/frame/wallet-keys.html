<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Solana Playground wallet keys</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
      }
      button {
        box-sizing: border-box;
        width: 100%;
        height: var(--height, 2.25rem);
        padding: var(--padding, 0 1rem);
        font-family: var(--font, system-ui, sans-serif);
        font-size: var(--font-size, 0.875rem);
        font-weight: var(--font-weight, 500);
        color: var(--fg, CanvasText);
        background: var(--bg, transparent);
        border: 1px solid var(--border, currentColor);
        border-radius: var(--radius, 0.375rem);
        cursor: pointer;
      }
      button:focus-visible {
        /* Inside the frame's edge, which would clip an outer ring */
        outline: 2px solid var(--focus, Highlight);
        outline-offset: -2px;
      }
      button:disabled {
        cursor: default;
      }
      button[aria-busy="true"] {
        opacity: 0.6;
        cursor: progress;
      }
    </style>
    <% for (const src of htmlWebpackPlugin.files.js) { %>
    <script defer crossorigin="anonymous" src="<%= src %>"></script>
    <% } %>
  </head>
  <body></body>
</html>
