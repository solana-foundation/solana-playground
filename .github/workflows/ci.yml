name: CI

# Validation gate for pushes to master and for every pull request, whatever
# its base, so internal PRs into feature branches are checked too.
# Deployment is handled separately by cicd.yml.
on:
  push:
    branches: ["master"]
  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/reusable-checks.yml
    with:
      build: false
