name: CI

# Runs on pushes to master and on every pull request, whatever its base: a
# pull_request run reads this file from the PR's merge commit, so a base
# without it runs nothing.
# Deployment is handled separately by cicd.yml.
on:
  push:
    branches: ["master"]
  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/reusable-checks.yml
    with:
      build: false
