name: CI

# Validation gate for pushes to master-2.0 and pull requests into it.
# Deployment is handled separately by cicd.yml.
on:
  push:
    branches: ["master-2.0"]
  pull_request:
    branches: ["master-2.0"]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/reusable-checks.yml
    with:
      build: false
