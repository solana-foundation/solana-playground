name: client-v2 checks

# The fork's frontend checks, shared by `client-v2.yml` (real wasm packages)
# and `client-v2-with-stubs.yml` (the stubs, run by hand). Upstream's ci.yml
# checks only formatting and clippy, not `client/`'s build or tests.
#
# Every action is pinned to a commit, the version tag beside it: a tag can
# be moved, a commit cannot.
# Runners are pinned to `ubuntu-26.04`, so the Chromium and Firefox results come from one known image; `ubuntu-latest` moves on GitHub's schedule.
on:
  workflow_call:
    inputs:
      # `true` writes the wasm stubs (`USE_WASM_STUBS=true`) and leaves out
      # what needs the real packages: the `@real-wasm` specs, the step "Check
      # the bundle carries the real wasm packages", and the `bench/BUNDLE.md`
      # snapshot test. `false` builds the real packages once, in the `wasm` job.
      use-wasm-stubs:
        type: boolean
        required: true
      # `true` adds a `firefox` entry to every shard of the `e2e` matrix.
      firefox:
        type: boolean
        default: false

permissions:
  contents: read

# The exact string `true` opts in (`client-v2/scripts/wasm-stubs.sh`); an
# empty value means the real packages.
env:
  USE_WASM_STUBS: ${{ inputs.use-wasm-stubs && 'true' || '' }}

jobs:
  # Builds the six `wasm/*/pkg` packages compiled from Rust and hands them to
  # the other jobs as an artifact. The built packages are cached under the
  # key Vercel's install uses (`wasm_source_key` in `vercel-install.sh`), so a
  # change that leaves `wasm/` alone skips the build; on a miss, the cargo
  # cache keeps the rebuild to the crates that changed.
  wasm:
    name: wasm packages
    if: ${{ !inputs.use-wasm-stubs }}
    runs-on: ubuntu-26.04
    # A cold build takes about an hour on a laptop.
    timeout-minutes: 150
    # The e2e shards restore the crates the steps below cache, by this key.
    outputs:
      crates-key: ${{ steps.crates-key.outputs.key }}

    defaults:
      run:
        working-directory: client-v2

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Key the wasm sources
        id: key
        run: |
          . scripts/vercel-install.sh
          # Its own line: set -e ignores a failure inside a command substitution used as an argument.
          key=$(wasm_source_key)
          [ -n "$key" ] || { echo "wasm_source_key printed nothing" >&2; exit 1; }
          echo "key=wasm-pkg-$key" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pkg-cache
        with:
          path: wasm/*/pkg
          key: ${{ steps.key.outputs.key }}

      # `vercel-install.sh`'s `RUST_ROOT`. The toolchains are not cached:
      # rustup reinstalls them in minutes, and a restored `cargo/bin` without
      # them would skip the install that adds the wasm target.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.pkg-cache.outputs.cache-hit != 'true'
        id: rust-cache
        with:
          path: |
            client-v2/.cache/rust/cargo/registry
            client-v2/.cache/rust/cargo/git
            client-v2/.cache/rust/target
            client-v2/.cache/rust/wasm-bindgen
          key: rust-${{ runner.os }}-${{ hashFiles('wasm/**/Cargo.lock', 'wasm/**/rust-toolchain.toml') }}
          restore-keys: rust-${{ runner.os }}-

      # Vercel's own build: the Rust version from `wasm/rust-toolchain.toml`,
      # and each package built by `wasm/build.sh` with its pinned wasm-bindgen
      # first on PATH (`client-v2/docs/deploy-client-vercel.md`, "wasm-bindgen").
      - name: Build the wasm packages
        if: steps.pkg-cache.outputs.cache-hit != 'true'
        run: |
          . scripts/vercel-install.sh
          build_wasm_packages

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.pkg-cache.outputs.cache-hit != 'true'
        with:
          path: wasm/*/pkg
          key: ${{ steps.key.outputs.key }}

      # Saved even when the build fails, so the next run starts warm.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.pkg-cache.outputs.cache-hit != 'true' && steps.rust-cache.outputs.cache-hit != 'true'
        with:
          path: |
            client-v2/.cache/rust/cargo/registry
            client-v2/.cache/rust/cargo/git
            client-v2/.cache/rust/target
            client-v2/.cache/rust/wasm-bindgen
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm-pkg
          path: wasm/*/pkg
          retention-days: 1
          if-no-files-found: error

      # Rust Analyzer's crates in `public/crates`, which the real analyzer needs: the dev server
      # answers a missing crate file with `index.html`. Restored into every e2e shard (not on stubs), where
      # `yarn dev`'s `generate-dev-crates` then finds them current by key.
      # Generated with the runner's own rustup, outside `vercel-install.sh`'s Rust state.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: client-v2/.nvmrc

      # The default crates' key covers the Node major and its brotli, hence the pinned Node above.
      - name: Key the crates
        id: crates-key
        run: |
          set -o pipefail
          # Each on its own line: set -e ignores a failure inside a command substitution used as an argument.
          supported=$(node scripts/generate-crates.mjs --key)
          default=$(node scripts/generate-default-crates.mjs --key)
          [ -n "$supported" ] && [ -n "$default" ] || { echo "a crate generator printed no key" >&2; exit 1; }
          hash=$(printf '%s %s' "$supported" "$default" | sha256sum | cut -d' ' -f1)
          echo "key=crates-$hash" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: crates-cache
        with:
          path: client-v2/public/crates
          key: ${{ steps.crates-key.outputs.key }}

      - name: Generate the crates
        if: steps.crates-cache.outputs.cache-hit != 'true'
        run: |
          node scripts/generate-default-crates.mjs
          node scripts/generate-crates.mjs

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.crates-cache.outputs.cache-hit != 'true'
        with:
          path: client-v2/public/crates
          key: ${{ steps.crates-key.outputs.key }}

  checks:
    name: checks
    needs: wasm
    # `wasm` is skipped on stubs; a skipped need would skip this job too.
    if: ${{ !cancelled() && (needs.wasm.result == 'success' || needs.wasm.result == 'skipped') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      CI: "true"
      # The API suite's integration cases skip themselves without this, so
      # without it they would pass by not running.
      #
      # `sslmode=disable` is an explicit opt-out, not a workaround: this
      # service container serves no TLS at all. Both dbmate and the app
      # otherwise require an encrypted, verified connection, which is what a
      # real database gets.
      DATABASE_URL: postgres://solpg:solpg@localhost:5432/solpg?sslmode=disable

    # The database `api/*.mjs` reads; the Rust build server holds none.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: solpg
          POSTGRES_PASSWORD: solpg
          POSTGRES_DB: solpg
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: client-v2

    steps:
      # `client-v2/public` is not tracked: scripts/update-static.mjs copies
      # it out of the `client/public` submodule and dates each tutorial
      # from that submodule's history, so the submodule is checked out
      # with full history.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: true
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: client-v2/.nvmrc
          cache: "yarn"
          cache-dependency-path: "client-v2/yarn.lock"

      # `yarn setup:with-stubs` without its `generate`, which compiles crates
      # with cargo; the cheaper `generate-fast` follows.
      - name: Stub the WASM packages and install
        if: inputs.use-wasm-stubs
        run: bash scripts/setup-wasm.sh

      # The upload's root is `wasm/`, so the artifact holds `<pkg>/pkg/...`.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ !inputs.use-wasm-stubs }}
        with:
          name: wasm-pkg
          path: wasm

      # A fresh runner has no `node_modules`, so nothing stale can survive.
      - name: Install
        if: ${{ !inputs.use-wasm-stubs }}
        run: yarn install --frozen-lockfile

      # Same cheap chain as `yarn dev`'s `generate-fast`: static assets, export barrels,
      # package and tutorial data, assistant context, so type-check and tests
      # see the generated files. The `build` job regenerates them in `build-fast`.
      - name: Generate
        run: yarn generate-fast

      # Pinned rather than `latest`: a migration tool that changes under CI
      # without anyone asking is a bad trade for the few seconds saved.
      - name: Install dbmate
        run: |
          curl -fsSL -o /usr/local/bin/dbmate \
            https://github.com/amacneil/dbmate/releases/download/v2.35.1/dbmate-linux-amd64
          chmod +x /usr/local/bin/dbmate

      # Applied explicitly, never from a function. This also proves the
      # migrations actually run from scratch, which a database that is only
      # ever migrated forward locally does not.
      - name: Apply migrations
        run: yarn db-migrate

      # db/schema.sql is derived from db/migrations/, and a stale one misleads
      # every reviewer -- it is the file people actually read. Regenerating it
      # from the migrations just applied proves it still matches. `db-dump`
      # takes pg_dump from the postgres:16 image here too, so its output matches
      # a local re-dump byte for byte.
      - name: Check db/schema.sql is current
        run: |
          yarn db-dump
          git diff --exit-code -- db/schema.sql || {
            echo "::error::db/schema.sql is stale -- run 'yarn db-dump' and commit the result"
            exit 1
          }

      - name: Check types
        run: yarn test-types

      - name: Check format
        run: yarn check-format

      - name: Check Markdown
        run: yarn check-md

      # The production build lints only the five layers and `api/`
      # (`lint:layers`, the boundary check among the rules). This step covers
      # all of `src/`, `api/` and `e2e/`. Only errors fail it: the review
      # rules in `eslintConfig` are errors, and the legacy code still holds
      # warnings, so they print without failing.
      - name: Lint
        run: yarn lint

      # Every colour comes from the design system's tokens; a hex or a
      # colour function anywhere else in `src/` fails the job.
      - name: Colour literals
        run: yarn check-colors

      # Every `src/tutorials/<slug>/tutorial.json` against its schema and
      # rules; each error prints as its JSON path.
      - name: Tutorial definitions
        run: yarn tutorial:check

      # `openspec validate --all` over ../openspec: every active change has
      # its proposal, delta specs, design and tasks in the schema's shape.
      - name: Validate specs
        run: yarn spec:validate

      # Report only: which scenarios have neither a browser test nor a
      # `(manual)` mark. `--strict` is for when the list is empty.
      - name: Scenario coverage
        run: yarn spec:coverage

      - name: Unit tests
        run: yarn test-unit

      # `node --test`, not vitest: `api/*.mjs` and the `.mjs` modules
      # behind each feature's `server.mjs` are plain ESM outside the
      # TypeScript build and need real Node.
      - name: API tests
        run: yarn test-api

  # The production build and the checks on what it emits, so a craco,
  # webpack or minifier change that breaks the output fails here.
  build:
    name: build
    needs: wasm
    if: ${{ !cancelled() && (needs.wasm.result == 'success' || needs.wasm.result == 'skipped') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      CI: "true"

    defaults:
      run:
        working-directory: client-v2

    steps:
      # `build-fast` copies `client-v2/public` out of the `client/public` submodule and dates tutorials from its history.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: true
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: client-v2/.nvmrc
          cache: "yarn"
          cache-dependency-path: "client-v2/yarn.lock"

      # `yarn setup:with-stubs` without its `generate`; `build-fast` generates.
      - name: Stub the WASM packages and install
        if: inputs.use-wasm-stubs
        run: bash scripts/setup-wasm.sh

      # The upload's root is `wasm/`, so the artifact holds `<pkg>/pkg/...`.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ !inputs.use-wasm-stubs }}
        with:
          name: wasm-pkg
          path: wasm

      # A fresh runner has no `node_modules`, so nothing stale can survive.
      - name: Install
        if: ${{ !inputs.use-wasm-stubs }}
        run: yarn install --frozen-lockfile

      - name: Production build
        run: yarn build-fast

      # Tailwind reaches the bundle only through craco's PostCSS override. If
      # that stops applying (a craco upgrade, a second CSS rule added after
      # craco's style pass), the build stays green and the page ships
      # unstyled, so look for one utility the Flow wrapper always carries.
      - name: Check Tailwind is in the built CSS
        run: |
          grep -q '\.flex{display:flex}' build/static/css/main.*.css || {
            echo "::error::Tailwind utilities are missing from build/static/css -- craco's PostCSS override is not applying"
            exit 1
          }

      # Change events are named after `_Pg*` classes; a minifier that drops the names passes the build and loops at runtime.
      - name: Check decorator class names survive minification
        run: |
          for name in _PgConnection _PgProgramInfo; do
            grep -q "\"$name\"" build/static/js/*.js || {
              echo "::error::$name is missing from build/static/js: the minifier drops class names (keepNames in scripts/esbuild-minify.mjs)"
              exit 1
            }
          done

      # Ahead of "Build tests", so the report reaches the pull request in the run where the snapshot test fails.
      # `github.event_name`, `github.event` and `GITHUB_BASE_REF` are the triggering workflow's (`client-v2.yml`).
      # continue-on-error: a report failure must not skip "Build tests".
      - name: Bundle change report
        id: report
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          scripts/bundle-info-report.sh "$GITHUB_BASE_REF" "$HEAD_SHA" || {
            echo "::warning::Bundle change report failed; the pull request gets no new bundle comment"
            exit 1
          }
          cat build/bundle-report.md >> "$GITHUB_STEP_SUMMARY"

      # A fork's pull request gets a read-only token here, so bundle-info-comment.yml posts the comment from this artifact.
      - name: Save bundle change report
        id: save-report
        if: steps.report.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-info-comment
          path: client-v2/build/bundle-report.md
          if-no-files-found: error

      - name: Warn about an unsaved bundle change report
        if: steps.save-report.outcome == 'failure'
        run: echo "::warning::Saving the bundle change report failed; the pull request gets no new bundle comment"

      # `*.build-test.mjs` reads `build/`, so it runs here rather than in `test-api`.
      - name: Build tests
        run: yarn test-build

      # The deploy's own post-build check (`scripts/vercel-build.sh`, `vercel.json`'s `buildCommand`).
      - name: Check the bundle carries the real wasm packages
        if: ${{ !inputs.use-wasm-stubs }}
        run: node scripts/wasm-stubs.mjs check-build build

  # The browser suite (`client-v2/e2e/`, Playwright) in its own job, so
  # `checks` stays short and a browser failure reads as one. No Postgres and
  # no secret: every spec stubs the account endpoints with `page.route`, and
  # the dev server serves `api/*.mjs` itself. The suite runs as shards, one
  # per matrix entry, each on its own runner; `e2e-report` reads every
  # shard's json report and checks the skips there against
  # `e2e/known-skips.txt`. `playwright.config.mts` says what `CI` changes.
  e2e:
    name: e2e (${{ matrix.browser }}, ${{ matrix.shard }})
    needs: wasm
    if: ${{ !cancelled() && (needs.wasm.result == 'success' || needs.wasm.result == 'skipped') }}
    runs-on: ubuntu-26.04
    # Measured on run 40369790881 (2026-10-26, 278 tests): about 4 minutes
    # from checkout to the first test (install, browser, dev-server compile),
    # and the slowest of four shards holds about 7 minutes of tests. By run
    # 41803972945 (2026-11-04, about 350 tests) four shards took 11 to 15
    # minutes each and the slowest hit `globalTimeout` with every test
    # passing, so the suite ran on six. On run 42103726526 (2026-11-06, the
    # users-work landing, about 430 tests) shard 6 hit it again at 15 minutes
    # with 80 tests passed and the rest unrun, so the suite ran on seven. On
    # runs 42371081017 and 42372511074 (2026-11-07, the wallet key origin,
    # about 590 tests) shard 6 hit it twice with every test it reached
    # passing, so the suite runs on eight. The
    # steps before `Browser tests` vary far more than the tests: on run
    # 40379245789 the apt downloads of `install-deps` took 11 minutes on one
    # shard and 20 seconds on another. This limit holds that variance;
    # Playwright's `globalTimeout` (playwright.config.mts) is what bounds the
    # tests, and a shard hung there still prints its summary. 40, not 30,
    # because `globalTimeout` is 25 (hoodieshq/solana-playground#377): on run
    # 42259738085 (2026-11-06, seven shards) the slowest shard's tests took
    # 14.7 minutes, and this limit stays above `globalTimeout` plus the
    # steps before the tests.
    timeout-minutes: 40

    strategy:
      # A red shard leaves the others running, so one run reports every
      # failure and `e2e-report` sees every report.
      fail-fast: false
      # `shard` lists 1..N without gaps and `shards` holds N, the `--shard`
      # divisor; a shard index the list skips is a slice nobody runs while
      # this job stays green, so `e2e-report` fails on the gap, per browser.
      # N is a matrix value, not `strategy.job-total`: a run filtered to some
      # jobs (`act --matrix`) would divide by the wrong count.
      matrix:
        browser: ${{ fromJSON(inputs.firefox && '["chromium","firefox"]' || '["chromium"]') }}
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
        shards: [8]

    defaults:
      run:
        working-directory: client-v2

    steps:
      # Same checkout as `checks`: `client-v2/public` is generated out of the
      # `client/public` submodule, dated from its history.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: true
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: client-v2/.nvmrc
          cache: "yarn"
          cache-dependency-path: "client-v2/yarn.lock"

      - name: Stub the WASM packages and install
        if: inputs.use-wasm-stubs
        run: bash scripts/setup-wasm.sh

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ !inputs.use-wasm-stubs }}
        with:
          name: wasm-pkg
          path: wasm

      - name: Install
        if: ${{ !inputs.use-wasm-stubs }}
        run: yarn install --frozen-lockfile

      # The `wasm` job's crates; a miss fails here rather than as a rust-analyzer panic mid-suite.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !inputs.use-wasm-stubs }}
        with:
          path: client-v2/public/crates
          key: ${{ needs.wasm.outputs.crates-key }}
          fail-on-cache-miss: true

      # The browser binary is cached by Playwright version, so only a bump
      # re-downloads it. The runner's system libraries are not cached: on a
      # hit they are installed alone (`install-deps`), on a miss together
      # with the browser (`--with-deps`).
      #
      # restore + save rather than `actions/cache`, whose post step saves
      # only when the job succeeds: while the suite is red, every run would
      # download the browser again, and a red suite is when runs are frequent.
      # The key names the shard's browser: a cache saved by the other browser
      # holds no binary for this one, and a hit would skip its install. It
      # names the runner image too (`ImageOS`, e.g. `ubuntu26`): `runner.os` is
      # `Linux` on every release, so a browser built on another image would load.
      # And `runner.arch`: an arm64 act run on the same image saved an aarch64
      # Firefox that an amd64 run restored and failed to spawn (ENOENT).
      - name: Playwright version
        id: playwright
        run: |
          echo "version=$(jq -r .version node_modules/@playwright/test/package.json)" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:?a GitHub-hosted runner sets ImageOS}" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright.outputs.image }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-${{ matrix.browser }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: yarn playwright install --with-deps ${{ matrix.browser }}

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: yarn playwright install-deps ${{ matrix.browser }}

      # `yarn dev` runs `generate-fast` and `generate-dev-crates` (current by key
      # from the restored cache, skipped on stubs) itself before `craco start`, and the
      # config starts it (`webServer`), so there is no separate generate step.
      # On stubs the `@real-wasm` specs, which run the CLIs, are left out with
      # `--grep-invert`, not `test.skip`: a skip outside `e2e/known-skips.txt`
      # fails `e2e-report`. The `@live-links` specs reach github.com, so a
      # GitHub outage cannot turn a PR red: `client-v2-live-links.yml` runs them.
      - name: Browser tests
        run: yarn test-e2e --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/${{ matrix.shards }} --grep-invert "${{ inputs.use-wasm-stubs && '@real-wasm|@live-links' || '@live-links' }}"

      # Traces, screenshots and the per-test error context of what failed.
      # Open a trace with `yarn playwright show-trace <file>`. `always()`,
      # not `failure()`: a run that `timeout-minutes` cancels is the one whose
      # trace matters most, and `failure()` does not fire for it. On a green
      # run the directory holds the json report and little else.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-test-results-${{ matrix.browser }}-${{ matrix.shard }}
          path: client-v2/test-results/
          retention-days: 7
          if-no-files-found: warn

  # The wallet's key origin is compiled into the bundle, and the other specs
  # were written against keys in the page, so its spec runs here, on a dev
  # server built with both settings on, and no shard runs it
  # (`playwright.config.mts`, `keyOriginRun`). A second server started inside
  # a shard compiled cold past the shard's `globalTimeout` (HOO-2680). The
  # steps are a shard's (see `e2e` for why each is there); `e2e-report`
  # checks this job's report on its own.
  e2e-key-origin:
    name: e2e (key origin)
    needs: wasm
    if: ${{ !cancelled() && (needs.wasm.result == 'success' || needs.wasm.result == 'skipped') }}
    runs-on: ubuntu-latest
    # A shard's setup (about 4 minutes, more on a slow apt mirror) and one
    # spec of five serial tests.
    timeout-minutes: 30
    env:
      REACT_APP_WALLET_KEY_ORIGIN: loopback
      REACT_APP_WALLET_APP_ORIGIN: loopback

    defaults:
      run:
        working-directory: client-v2

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: true
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: client-v2/.nvmrc
          cache: "yarn"
          cache-dependency-path: "client-v2/yarn.lock"

      - name: Stub the WASM packages and install
        if: inputs.use-wasm-stubs
        run: bash scripts/setup-wasm.sh

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ !inputs.use-wasm-stubs }}
        with:
          name: wasm-pkg
          path: wasm

      - name: Install
        if: ${{ !inputs.use-wasm-stubs }}
        run: yarn install --frozen-lockfile

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !inputs.use-wasm-stubs }}
        with:
          path: client-v2/public/crates
          key: ${{ needs.wasm.outputs.crates-key }}
          fail-on-cache-miss: true

      - name: Playwright version
        id: playwright
        run: echo "version=$(jq -r .version node_modules/@playwright/test/package.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: yarn playwright install --with-deps chromium

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: yarn playwright install-deps chromium

      # The env above narrows the run to the key-origin spec
      # (`playwright.config.mts`, `keyOriginRun`). `--shard=1/1` only so the
      # json report carries `config.shard`, which `e2e-report` requires.
      - name: Browser tests
        run: yarn test-e2e --shard=1/1 ${{ inputs.use-wasm-stubs && '--grep-invert @real-wasm' || '' }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-key-origin-results
          path: client-v2/test-results/
          retention-days: 7
          if-no-files-found: warn

  # The skip check, once over every shard's report: run per shard, it would
  # warn "stale known skip" from every shard that does not hold the listed
  # test. `always()`, so a red shard's report is still read, and a shard
  # whose report never arrived fails here instead of passing by absence. The
  # checks are `scripts/e2e-report.mjs`, tested by `scripts/e2e-report.test.mjs`
  # (`yarn test-api`). The `e2e-key-origin` job's report is checked by a
  # second pass of the same script, after the shards'.
  e2e-report:
    name: e2e-report
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    needs: [e2e, e2e-key-origin]
    if: always()

    defaults:
      run:
        working-directory: client-v2

    steps:
      # The script, its list and the Node pin are all this job reads from
      # the repository; nothing is installed.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            client-v2/e2e/known-skips.txt
            client-v2/scripts/e2e-report.mjs
            client-v2/scripts/e2e-projects.mjs
            client-v2/.nvmrc
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: client-v2/.nvmrc

      # One directory per shard, named after its artifact, so a shard that
      # uploaded nothing is a missing directory rather than a quiet merge.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: playwright-test-results-*
          merge-multiple: false
          path: client-v2/shard-reports

      # Playwright writes `config.shard` as `{ total, current }` into the
      # json report. Each browser's reports must agree on `total` and cover 1..total: a
      # cancelled shard, a shard that never reached a report, or a lost
      # upload is a slice nobody checked, not a pass. A skipped test is green
      # to Playwright, and so is one that passed on its retry; the reporters
      # name neither. Both are read from the json reports: a skip outside
      # `e2e/known-skips.txt` fails the job, a listed test that no longer
      # skips is a warning to prune the list, and a flaky test is a warning
      # with its title -- work to do, not a pass.
      # The expression of the `e2e` matrix's `browser`, so a run that lost every report of one browser fails here.
      - name: Check the shards and their skips
        env:
          E2E_PROJECTS: ${{ join(fromJSON(inputs.firefox && '["chromium","firefox"]' || '["chromium"]'), ',') }}
        run: node scripts/e2e-report.mjs shard-reports e2e/known-skips.txt

      # The `e2e-key-origin` job's report, a run of its own (`--shard=1/1`),
      # so it is checked apart from the shards' 1..N. It expects no skip at
      # all: `/dev/null` is an empty known-skips list, where the shards' list
      # would warn "stale known skip" for every title this run never holds.
      # A missing report fails here as a missing shard does above.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: always()
        with:
          # By name, into a directory of its own: a single artifact downloads
          # straight into `path`, and the report script reads `<dir>/*/report.json`
          name: playwright-key-origin-results
          path: client-v2/key-origin-reports/key-origin

      - name: Check the key-origin run and its skips
        if: always()
        env:
          E2E_PROJECTS: chromium
        run: node scripts/e2e-report.mjs key-origin-reports /dev/null

  # A called workflow whose jobs were skipped still concludes `success`, and
  # the caller sees only that conclusion. This job fails the workflow unless
  # every job ran and succeeded, `wasm` alone being skipped on the stubs.
  # A job added above joins `needs` and the list below.
  gate:
    name: gate
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    needs: [wasm, checks, build, e2e, e2e-key-origin, e2e-report]
    if: always()
    steps:
      - name: Every job ran and succeeded
        env:
          STUBS: ${{ inputs.use-wasm-stubs }}
          WASM: ${{ needs.wasm.result }}
          OTHERS: ${{ needs.checks.result }} ${{ needs.build.result }} ${{ needs.e2e.result }} ${{ needs.e2e-key-origin.result }} ${{ needs.e2e-report.result }}
        run: |
          echo "wasm: $WASM; checks, build, e2e, e2e-key-origin, e2e-report: $OTHERS"
          expected=success
          [ "$STUBS" = true ] && expected=skipped
          [ "$WASM" = "$expected" ] || exit 1
          for result in $OTHERS; do
            [ "$result" = success ] || exit 1
          done
