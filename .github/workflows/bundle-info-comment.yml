name: Bundle info comment

# Posts the client-v2 build job's bundle change report as one sticky comment; ported from the Solana Explorer's build-info-comment.yaml.
# Not in client-v2.yml: a fork's pull request runs CI with a read-only token, and this runs in the base repository without the pull request's code.
on:
  workflow_run:
    workflows: [client-v2]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  comment:
    name: comment
    # Any conclusion: the report uploads before "Build tests", so a stale snapshot still gets its comment.
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # The default branch's copy of one file only, which is safe in this privileged context.
      - name: Checkout locate script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            client-v2/scripts/bundle-info-locate-pr.mjs
          sparse-checkout-cone-mode: false

      # The artifact is missing when the build job failed before uploading it; the pull request comes from the head
      # commit, since `workflow_run.pull_requests` is empty for a fork's pull request.
      - name: Locate report and pull request
        id: locate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { locatePullRequest } = await import('${{ github.workspace }}/client-v2/scripts/bundle-info-locate-pr.mjs');
            await locatePullRequest({ context, core, github });

      # Outside the workspace: the artifact is fork-controlled and must not place files where a later step reads them.
      - name: Download report
        if: steps.locate.outputs.found == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundle-info-comment
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/bundle-info-comment

      - name: Post sticky comment
        if: steps.locate.outputs.found == 'true'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: bundle-info
          path: ${{ runner.temp }}/bundle-info-comment/bundle-report.md
          number_force: ${{ steps.locate.outputs.pr }}
