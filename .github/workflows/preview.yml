name: preview

# A preview deployment of client-v2, with its own Neon database, for a PR that
# carries the `preview` label, and only for that PR. The Neon project caps its
# branch count, so the Vercel integration's branch-per-deployment option is
# off (see client-v2/docs/neon.md) and this workflow owns the branch instead:
#
# - labelled, opened/reopened or pushed to while labelled: create (or reuse)
#   `preview/pr-<number>` from `main`, migrate it, build, deploy with it
#   as DATABASE_URL, and post the URL on the PR;
# - label removed, or PR closed or merged: delete the branch.
#
# Previews follow the label on a PR into any branch of the repository the
# PREVIEW_REPOSITORY variable names. A labelled PR on another repository or
# from a fork gets skipped preview checks and no comment.
#
# PREVIEW_REPOSITORY holds a repository name, not a boolean, so set at
# organisation level it still enables one repository, not all of them. The
# `deploy` and `teardown` jobs run only where PREVIEW_REPOSITORY names this
# repository and the NEON_PROJECT_ID variable is set. Enabling previews on a
# repository also needs the NEON_API_KEY secret there; `deploy` needs the
# VERCEL_TOKEN secret and the VERCEL_ORG_ID and VERCEL_PROJECT_ID variables
# too, while `teardown` and preview-sweep.yml need only the Neon ones
# (client-v2/docs/neon.md, "Configuration").
#
# What this misses is a teardown that fails or is cancelled.
# preview-sweep.yml's daily run deletes `preview/pr-<number>` once its PR is
# closed or unlabelled; a manual run with scope `all-preview` deletes
# `preview/<head branch>` once its PR is closed.
#
# The label name is spelled out in the `if:`s below because job conditions
# cannot read `env`; keep every one, and PREVIEW_LABEL in preview-sweep.yml,
# in step with PREVIEW_LABEL. A sweep with the old name keeps no preview alive
# and deletes every one.
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, closed]

permissions: {}

defaults:
  run:
    # Explicit, for pipefail: the implicit default runs `bash -e` without it.
    shell: bash

env:
  PREVIEW_LABEL: preview
  BRANCH: preview/pr-${{ github.event.pull_request.number }}
  # Same name as in client-v2/.env; see client-v2/docs/neon.md. NEON_API_KEY is
  # given per step instead, to keep it from `vercel build`, which runs the PR's
  # code.
  NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}

jobs:
  deploy:
    name: deploy preview branch
    # A fork's PR gets no secrets, and Dependabot gets only Dependabot
    # secrets. A Dependabot PR never deploys, even labelled by a human: the
    # run would build its code with the deploy secrets. Unrelated label
    # changes do not redeploy.
    # Runs only where PREVIEW_REPOSITORY names this repository and
    # NEON_PROJECT_ID is set (see the header).
    if: >-
      vars.NEON_PROJECT_ID != '' && github.repository == vars.PREVIEW_REPOSITORY &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'preview') &&
      (contains(fromJSON('["opened", "reopened", "synchronize"]'), github.event.action) ||
       (github.event.action == 'labeled' && github.event.label.name == 'preview'))
    # Job-level, shared with teardown: a push cancels the deploy it supersedes,
    # and a close cancels a deploy still running. A workflow-level group would
    # also let every skipped run (an unrelated label) cancel a live deploy.
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    # A wasm Remote Cache miss rebuilds the packages, about an hour.
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      # vercel-install.sh's Remote Cache credentials, which a Vercel build is
      # given and a runner is not.
      VERCEL_ARTIFACTS_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ARTIFACTS_OWNER: ${{ vars.VERCEL_ORG_ID }}
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # The head commit, not the merge commit `pull_request` checks out by
      # default: the preview shows the branch as pushed. Submodule with full
      # history, as in client-v2.yml: update-static dates tutorials from it.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: true
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: client-v2/.nvmrc

      - name: Check configuration
        run: |
          : "${VERCEL_TOKEN:?VERCEL_TOKEN secret is unset}"
          : "${VERCEL_ORG_ID:?VERCEL_ORG_ID variable is unset}"
          : "${VERCEL_PROJECT_ID:?VERCEL_PROJECT_ID variable is unset}"

      - name: Neon branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: bash .github/scripts/neon.sh ensure "$BRANCH" >/dev/null

      # Same pinned version as client-v2.yml.
      - name: Install dbmate
        run: |
          curl -fsSL -o /usr/local/bin/dbmate \
            https://github.com/amacneil/dbmate/releases/download/v2.35.1/dbmate-linux-amd64
          chmod +x /usr/local/bin/dbmate

      # Direct connection, not the PgBouncer endpoint, and without
      # `channel_binding`, which dbmate's driver cannot parse. Every run, not
      # only the first: a push may add a migration.
      - name: Migrate the preview database
        working-directory: client-v2
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          url=$(bash ../.github/scripts/neon.sh uri "$BRANCH")
          echo "::add-mask::$url"
          url=$(printf '%s' "$url" | sed -E 's/([?&])channel_binding=[^&]*&?/\1/; s/[?&]$//')
          # The mask above covers the raw string only; this is what dbmate gets.
          echo "::add-mask::$url"
          case "$url" in *sslmode=*) ;; *) echo "::error::Neon returned a URL without sslmode"; exit 1 ;; esac
          DATABASE_URL="$url" dbmate --wait --wait-timeout 60s --no-dump-schema up

      # The same chain as Makefile.vercel's deploy-client-to-vercel-preview,
      # with its CLI version: pull, pin the Root Directory, build here, deploy
      # the prebuilt output. The Git integration deploys the same push on its
      # own; this deployment differs in its DATABASE_URL, the PR's Neon branch.
      - name: Build and deploy
        id: deploy
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          cli=$(sed -n 's/^VERCEL_CLI := //p' client-v2/Makefile.vercel)
          [ -n "$cli" ] || { echo "::error::no VERCEL_CLI in client-v2/Makefile.vercel"; exit 1; }
          db=$(bash .github/scripts/neon.sh uri "$BRANCH" pooled)
          echo "::add-mask::$db"
          # Nothing below needs it, and `vercel build` runs the PR's code.
          unset NEON_API_KEY
          npx --yes "$cli" pull --yes --environment=preview --token="$VERCEL_TOKEN"
          jq '.settings.rootDirectory = "client-v2"' .vercel/project.json > .vercel/project.json.next
          mv .vercel/project.json.next .vercel/project.json
          # Separate lines: `-e` does not stop on a failure inside an && list.
          set -a
          . ./.vercel/.env.preview.local
          set +a
          npx --yes "$cli" build --token="$VERCEL_TOKEN"
          # Every file under api/ becomes a public function unless
          # client-v2/.vercelignore drops it, and a test there writes to the
          # database it is given (HOO-2175).
          tests=$(find .vercel/output/functions -name '*.test.func')
          [ -z "$tests" ] || { echo "::error::test files deployed as functions: $tests"; exit 1; }
          # --archive=tgz: the prebuilt output is over the upload API's 15000-file cap.
          url=$(npx --yes "$cli" deploy --prebuilt --archive=tgz --token="$VERCEL_TOKEN" \
            -e DATABASE_URL="$db" --meta githubPrId="$PR" --meta githubCommitSha="$SHA")
          [ -n "$url" ] || { echo "::error::vercel deploy printed no URL"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Preview: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the PR
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          bash .github/scripts/preview-comment.sh "$PR" "**Preview:** $URL

          Commit \`${SHA::7}\`, database: Neon branch \`$BRANCH\`, migrated. Remove the \`$PREVIEW_LABEL\` label or close the PR to drop the database."

      # Not on cancel: a newer push's run or the teardown writes the comment.
      - name: Report the failure on the PR
        if: failure()
        run: |
          bash .github/scripts/preview-comment.sh "$PR" "**Preview deploy failed** for commit \`${SHA::7}\`: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          An earlier preview, if any, still serves an earlier commit, and its database may be partly migrated."

  teardown:
    name: drop preview database
    # Runs only where PREVIEW_REPOSITORY names this repository and
    # NEON_PROJECT_ID is set (see the header). Not for a run Dependabot
    # triggers: it gets no NEON_API_KEY.
    if: >-
      vars.NEON_PROJECT_ID != '' && github.repository == vars.PREVIEW_REPOSITORY &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'closed' ||
       (github.event.action == 'unlabeled' && github.event.label.name == 'preview'))
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    # Above the deletes' worst case, four neon.sh `api()` calls of about 7
    # minutes each: a slow Neon then fails the step rather than timing out,
    # which cancels the job and skips the failure report.
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      # Sparse: only the scripts, not the submodule.
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts

      # `preview/<head branch>` is the name the Vercel integration gave a branch
      # before this workflow existed, and the one neon-preview-branch.sh (`make
      # deploy-client-to-vercel-preview`) still gives, so it is cleaned up too.
      # Except where that name means something else: `pr-<n>` would be another
      # PR's live preview, and `preview/master` is the production dry run's
      # branch (deploy-client-vercel.md). Each delete runs even if the other
      # fails; `failed` names the branches left, for the failure report.
      - name: Delete the Neon branches
        id: delete
        run: |
          failed=""
          bash .github/scripts/neon.sh delete "$BRANCH" || failed="\`$BRANCH\`"
          if [[ "$HEAD_REF" =~ ^(pr-[0-9]+|master)$ ]]; then
            echo "keeping preview/$HEAD_REF: not this PR's to delete"
          else
            bash .github/scripts/neon.sh delete "preview/$HEAD_REF" ||
              failed="${failed:+$failed and }\`preview/$HEAD_REF\`"
          fi
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          [ -z "$failed" ]

      # `--edit-only`: a PR that never had a preview gets no comment. Runs only
      # on success, so a failed delete gets the failure report instead.
      - name: Update the PR comment
        run: |
          bash .github/scripts/preview-comment.sh --edit-only "$PR" "Preview database \`$BRANCH\` deleted. The last deployment still loads but has no database; add the \`$PREVIEW_LABEL\` label again to redeploy."

      # Not on cancel: a newer run for the same PR cancels this one through
      # the concurrency group and writes the comment itself, which a report
      # on cancel would overwrite. Without `--edit-only`: a PR with no preview
      # comment still gets the report.
      - name: Report the failure on the PR
        if: failure()
        env:
          DELETE_OUTCOME: ${{ steps.delete.outcome }}
          FAILED: ${{ steps.delete.outputs.failed }}
        run: |
          remedy="Re-run the failed job. Once the PR is closed, a manual preview-sweep.yml run with scope \`all-preview\` and \`dry_run\` unticked (\"List what would be deleted, delete nothing\") also deletes \`preview/<head branch>\`; the daily sweep deletes \`$BRANCH\` on its own."
          case "$DELETE_OUTCOME" in
            success) detail="The Neon branches were deleted; a later step failed." ;;
            failure) detail="Not deleted: ${FAILED:-unknown}. $remedy" ;;
            *) detail="The run failed before the deletes, so nothing was deleted. $remedy" ;;
          esac
          bash .github/scripts/preview-comment.sh "$PR" "**Preview teardown failed**: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          $detail"

  # Without this job a half-configured repository skips `deploy` silently.
  configuration:
    name: check preview configuration
    if: >-
      vars.NEON_PROJECT_ID != '' && github.repository != vars.PREVIEW_REPOSITORY &&
      contains(github.event.pull_request.labels.*.name, 'preview') &&
      (contains(fromJSON('["opened", "reopened", "synchronize"]'), github.event.action) ||
       (github.event.action == 'labeled' && github.event.label.name == 'preview'))
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - run: echo "::warning::Previews are half-configured; NEON_PROJECT_ID is set, but PREVIEW_REPOSITORY is unset or names another repository (client-v2/docs/neon.md, \"Configuration\")."
