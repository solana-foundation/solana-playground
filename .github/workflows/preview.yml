name: Preview

# A preview deployment of client-v2 with a database of its own, for a PR that
# carries the `preview` label, and only for that PR. The Vercel Git
# integration builds a preview only of an integration branch
# (`isIntegrationBranch` in client-v2/scripts/vercel-ignore-build.mjs), which
# reads the database the Preview environment names: the shared `solpg_preview`
# once PREVIEW_DB_PROVIDER is `cloud-sql` (client-v2/docs/preview-databases.md).
# This workflow is for a PR whose preview needs its own schema or rows.
#
# The repository variable PREVIEW_DB_PROVIDER says where that database lives:
#
# - `cloud-sql`: `solpg_preview_pr_<number>` on the preview Cloud SQL
#   instance, a copy of the shared `solpg_preview` without its sessions,
#   reached as the
#   `github-ci` service account through Workload Identity Federation;
# - unset: the Neon branch `preview/pr-<number>` cut from `main`, until a
#   follow-up removes Neon. The Neon project caps its branch count, so the
#   Vercel integration's branch-per-deployment option is off
#   (client-v2/docs/neon.md).
#
# - labelled, opened/reopened or pushed to while labelled: create (or reuse)
#   the database, migrate it, build, deploy with it, and post the URL on the
#   PR;
# - label removed, or PR closed or merged: drop the database;
# - unlabelled, from an integration branch, and changing
#   client-v2/db/migrations, on Cloud SQL: say on the PR that the Git
#   integration's preview runs on the shared database without those
#   migrations, and suggest the label.
#
# Previews follow the label on a PR into any branch of the repository the
# PREVIEW_REPOSITORY variable names. A labelled PR on another repository or
# from a fork gets skipped preview checks and no comment.
#
# PREVIEW_REPOSITORY holds a repository name, not a boolean, so set at
# organisation level it still enables one repository, not all of them. The
# preview chain (`database` first; the other jobs follow it) and `teardown`
# run only where PREVIEW_REPOSITORY names this repository and either
# PREVIEW_DB_PROVIDER is `cloud-sql` or the NEON_PROJECT_ID variable is set.
# `prepare` and `deploy` need the VERCEL_TOKEN secret and the VERCEL_ORG_ID
# and VERCEL_PROJECT_ID variables. On Cloud SQL the jobs that reach the
# database need the PREVIEW_CLOUD_SQL_INSTANCE, PREVIEW_CLOUD_SQL_USER,
# GCP_CI_WORKLOAD_IDENTITY_PROVIDER, and GCP_CI_SERVICE_ACCOUNT variables
# (client-v2/docs/preview-databases.md, "Configuration"); on Neon, the
# NEON_API_KEY secret (client-v2/docs/neon.md, "Configuration").
#
# What this misses is a teardown that fails or is cancelled.
# preview-sweep.yml's daily run deletes `solpg_preview_pr_<number>` or
# `preview/pr-<number>` once its PR is closed or unlabelled; a manual run with scope `all-preview` deletes
# `preview/<head branch>` once its PR is closed.
#
# The label name is spelled out in the `if:`s below because job conditions
# cannot read `env`; keep every one, and PREVIEW_LABEL in preview-sweep.yml,
# in step with PREVIEW_LABEL. A sweep with the old name keeps no preview alive
# and deletes every one.
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, closed]

permissions: {}

# The whole run holds the group, not each job: a job that joined on its own
# when its `needs` finished could cancel a newer push's run, or the teardown.
# A push to a labelled PR cancels the run it supersedes, and a close or an
# unlabel cancels a deploy still going. A run no preview job reacts to (an
# unrelated label, a push to an unlabelled PR) gets a group of its own, so it
# never cancels a live deploy. The label name is spelled out, as in the `if:`s.
concurrency:
  group: >-
    ${{ (github.event.action == 'closed' ||
         (contains(fromJSON('["labeled", "unlabeled"]'), github.event.action) &&
          github.event.label.name == 'preview') ||
         (contains(fromJSON('["opened", "reopened", "synchronize"]'), github.event.action) &&
          contains(github.event.pull_request.labels.*.name, 'preview')))
        && format('preview-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    # Explicit, for pipefail: the implicit default runs `bash -e` without it.
    shell: bash

env:
  PREVIEW_LABEL: preview
  BRANCH: preview/pr-${{ github.event.pull_request.number }}
  # Same name as in client-v2/.env; see client-v2/docs/neon.md. NEON_API_KEY is
  # given per step (per job in teardown, which runs nothing else), to keep it
  # from the steps that need none, the Vercel CLI's among them.
  NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
  PREVIEW_DB_PROVIDER: ${{ vars.PREVIEW_DB_PROVIDER }}
  # The preview instance and the user the application connects as, read by
  # client-v2/scripts/db/cloud-sql/*; the proxy logs in as github-ci, whose
  # IAM database user is its e-mail without `.gserviceaccount.com`.
  CLOUD_SQL_INSTANCE: ${{ vars.PREVIEW_CLOUD_SQL_INSTANCE }}
  CLOUD_SQL_USER: ${{ vars.PREVIEW_CLOUD_SQL_USER }}
  CLOUD_SQL_LOGIN_USER: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}

jobs:
  # A labelled PR's preview, in a chain of jobs that keeps the workflow's
  # credentials away from the code nobody reviews line by line: `yarn install`'s
  # dependencies and what `vercel build` runs over them (HOO-2888). Those run
  # only in `keys` and `build`, which hold no credential. The jobs that do hold
  # one run the workflow's own scripts under .github/scripts, the database
  # scripts under client-v2/scripts/db, dbmate and the Vercel CLI, and read
  # client-v2/Makefile.vercel only for the CLI's version. Those scripts come
  # from the PR's head like this file does, so they are as trusted as the
  # workflow: a branch that can edit them can edit the workflow too. The
  # split guards against a harmful dependency, not against the branch's author.
  # The deployed preview still runs the dependencies, on Vercel, with the
  # Preview environment's secrets and the PR's database; that is what a
  # preview is, and why only a maintainer's label starts one.
  #
  #   database  provisions and migrates the PR's database   (Google OIDC or NEON_API_KEY)
  #   keys      keys the wasm and crate caches              (no credential)
  #   prepare   pulls the Preview settings, fetches caches  (VERCEL_TOKEN)
  #   build     `vercel build`, the dependencies' code      (no credential)
  #   deploy    uploads build's output, comments on the PR  (VERCEL_TOKEN, NEON_API_KEY, GitHub)
  #   report    comments on the PR when a job failed        (GitHub)
  #
  # Only `database` carries the conditions; the others follow it through
  # `needs`. The run as a whole holds the concurrency group (above `jobs:`).
  database:
    name: preview database
    # A fork's PR gets no secrets, and a run Dependabot triggers gets only
    # Dependabot secrets. A Dependabot PR never deploys, even when a human's
    # label gives the run full secrets: the `user.login` condition below keeps
    # it out, not missing secrets, so keep it. Unrelated label changes do not
    # redeploy.
    # Runs only where PREVIEW_REPOSITORY names this repository and a provider
    # is configured (see the header).
    if: >-
      (vars.PREVIEW_DB_PROVIDER == 'cloud-sql' || vars.NEON_PROJECT_ID != '') &&
      github.repository == vars.PREVIEW_REPOSITORY &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'preview') &&
      (contains(fromJSON('["opened", "reopened", "synchronize"]'), github.event.action) ||
       (github.event.action == 'labeled' && github.event.label.name == 'preview'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # The GitHub OIDC token google-github-actions/auth exchanges on Cloud SQL
      id-token: write
    outputs:
      cloud-sql-database: ${{ steps.cloud-sql.outputs.CLOUD_SQL_DATABASE }}
    env:
      PR: ${{ github.event.pull_request.number }}
    steps:
      # The scripts and the migrations, no submodule and no install: dbmate
      # sends the migrations to the database server, and no dependency of
      # client-v2 runs here. The runner's own Node runs preview-name.mjs.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: |
            .github/scripts
            client-v2/scripts/db
            client-v2/db/migrations

      # First in the chain, so a half-configured repository fails before a
      # database is made. Whether the token is set, never its value.
      - name: Check configuration
        env:
          HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          [ "$HAS_VERCEL_TOKEN" = true ] || { echo "::error::VERCEL_TOKEN secret is unset"; exit 1; }
          : "${VERCEL_ORG_ID:?VERCEL_ORG_ID variable is unset}"
          : "${VERCEL_PROJECT_ID:?VERCEL_PROJECT_ID variable is unset}"
          case "$PREVIEW_DB_PROVIDER" in
            cloud-sql)
              : "${CLOUD_SQL_INSTANCE:?PREVIEW_CLOUD_SQL_INSTANCE variable is unset}"
              : "${CLOUD_SQL_USER:?PREVIEW_CLOUD_SQL_USER variable is unset}"
              : "${CLOUD_SQL_LOGIN_USER:?GCP_CI_SERVICE_ACCOUNT variable is unset}"
              ;;
            "") ;;
            *) echo "::error::PREVIEW_DB_PROVIDER is \"$PREVIEW_DB_PROVIDER\"; expected cloud-sql or unset"; exit 1 ;;
          esac

      - name: Google Cloud credentials
        if: env.PREVIEW_DB_PROVIDER == 'cloud-sql'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_CI_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}

      - name: Install the Cloud SQL Auth Proxy and pg_dump
        if: env.PREVIEW_DB_PROVIDER == 'cloud-sql'
        run: bash .github/scripts/install-cloud-sql-proxy.sh --with-pg-dump

      - name: Neon branch
        if: env.PREVIEW_DB_PROVIDER != 'cloud-sql'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: bash .github/scripts/neon.sh ensure "$BRANCH" >/dev/null

      # Same pinned version as client-v2.yml.
      - name: Install dbmate
        run: |
          curl -fsSL -o /usr/local/bin/dbmate \
            https://github.com/amacneil/dbmate/releases/download/v2.35.1/dbmate-linux-amd64
          chmod +x /usr/local/bin/dbmate

      # Copied from the shared database on the first run, reused after, so a
      # migration below meets the rows previews have written. Prints
      # DB_PROVIDER and CLOUD_SQL_DATABASE, which become this step's outputs.
      - name: Cloud SQL database
        id: cloud-sql
        if: env.PREVIEW_DB_PROVIDER == 'cloud-sql'
        run: bash client-v2/scripts/db/cloud-sql/create-preview-db --pr "$PR" >> "$GITHUB_OUTPUT"

      # Every run, not only the first: a push may add a migration. As the
      # application's role, so it owns what a migration creates.
      - name: Migrate the Cloud SQL database
        if: env.PREVIEW_DB_PROVIDER == 'cloud-sql'
        working-directory: client-v2
        run: bash scripts/db/cloud-sql/migration-url --pr "$PR" -- dbmate --wait --wait-timeout 60s --no-dump-schema up

      # Direct connection, not the PgBouncer endpoint, and without
      # `channel_binding`, which dbmate's driver cannot parse. Every run, not
      # only the first: a push may add a migration.
      - name: Migrate the Neon branch
        if: env.PREVIEW_DB_PROVIDER != 'cloud-sql'
        working-directory: client-v2
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          url=$(bash ../.github/scripts/neon.sh uri "$BRANCH")
          echo "::add-mask::$url"
          url=$(printf '%s' "$url" | sed -E 's/([?&])channel_binding=[^&]*&?/\1/; s/[?&]$//')
          # The mask above covers the raw string only; this is what dbmate gets.
          echo "::add-mask::$url"
          case "$url" in *sslmode=*) ;; *) echo "::error::Neon returned a URL without sslmode"; exit 1 ;; esac
          DATABASE_URL="$url" dbmate --wait --wait-timeout 60s --no-dump-schema up

  # The cache keys vercel-install.sh will look up, computed by its own code
  # from the PR's files, so `prepare` can fetch them without running any of
  # it. Without them the build, which has no Remote Cache token, rebuilds the
  # wasm packages: about an hour.
  keys:
    name: preview cache keys
    needs: database
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      wasm: ${{ steps.key.outputs.wasm }}
      crates: ${{ steps.key.outputs.crates }}
    defaults:
      run:
        working-directory: client-v2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: |
            wasm
            client-v2/scripts

      # The crates' key covers the Node major and its brotli: the same Node
      # as the build.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: client-v2/.nvmrc

      # The keys restore_wasm_packages and restore_default_crates compute.
      - name: Key the caches
        id: key
        run: |
          . scripts/vercel-install.sh
          # Each on its own line: set -e ignores a failure inside a command
          # substitution used as an argument.
          wasm=$(wasm_source_key)
          inputs=$(node scripts/generate-default-crates.mjs --key)
          crates=$(printf 'default-crates-%s' "$inputs" | sha256 | cut -d' ' -f1)
          echo "wasm=$wasm" >> "$GITHUB_OUTPUT"
          echo "crates=$crates" >> "$GITHUB_OUTPUT"

  # Everything the build would need a credential for, fetched here and handed
  # over as the artifact `preview-inputs`: the project settings, the Preview
  # environment with every value but the public ones replaced
  # (.github/scripts/preview-build-env.mjs), and the two cache archives. The
  # artifact is readable by anyone who can read the repository, so nothing
  # secret goes into it.
  prepare:
    name: preview settings and caches
    needs: keys
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      WASM_KEY: ${{ needs.keys.outputs.wasm }}
      CRATES_KEY: ${{ needs.keys.outputs.crates }}
    steps:
      # Two files, and no root files either: non-cone mode, so no .npmrc
      # reaches the npx calls below.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/preview-build-env.mjs
            /client-v2/Makefile.vercel

      # The version is the PR's to choose, the package is not: anything but
      # vercel@x.y.z would run as whatever npm package it names.
      - name: Vercel CLI version
        id: cli
        run: |
          cli=$(sed -n 's/^VERCEL_CLI := //p' client-v2/Makefile.vercel)
          [[ "$cli" =~ ^vercel@[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
            { echo "::error::VERCEL_CLI in client-v2/Makefile.vercel is \"$cli\"; expected vercel@x.y.z"; exit 1; }
          echo "cli=$cli" >> "$GITHUB_OUTPUT"

      # The same pull as Makefile.vercel's deploy-client-to-vercel-preview,
      # with the Root Directory pinned, since the build runs at the root.
      - name: Pull the Preview settings
        env:
          CLI: ${{ steps.cli.outputs.cli }}
        run: |
          npx --yes "$CLI" pull --yes --environment=preview --token="$VERCEL_TOKEN"
          mkdir -p inputs/.vercel
          jq '.settings.rootDirectory = "client-v2"' .vercel/project.json > inputs/.vercel/project.json
          node .github/scripts/preview-build-env.mjs .vercel/.env.preview.local inputs/.vercel/.env.preview.local
          rm -rf .vercel

      # vercel-install.sh's Remote Cache lookups, read-only. A miss is not a
      # failure: the build makes what is missing, and having no token it
      # stores nothing, so a labelled branch that changes wasm/ rebuilds on
      # every push until a build on Vercel fills the cache.
      # A refused token is a failure, since every preview would rebuild.
      - name: Fetch the cache archives
        run: |
          for key in "$WASM_KEY" "$CRATES_KEY"; do
            [[ "$key" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::cache key \"$key\" is not a sha256"; exit 1; }
          done
          fetch() { # $1: key, $2: destination
            mkdir -p "$(dirname "$2")"
            # A transfer cut short exits non-zero with whatever status arrived.
            # Bounded, so a stalled download warns instead of hitting the job's timeout.
            status=$(curl -sS --connect-timeout 20 --max-time 300 -H "Authorization: Bearer $VERCEL_TOKEN" -o "$2" -w '%{http_code}' \
              "https://api.vercel.com/v8/artifacts/$1?teamId=$VERCEL_ORG_ID") || status="curl exit $? ($status)"
            case "$status" in
              2??) echo "$1: HIT" ;;
              404) rm -f "$2"; echo "::notice::Remote Cache has no $1; the build makes it" ;;
              401 | 403) rm -f "$2"; echo "::error::Remote Cache refused VERCEL_TOKEN (HTTP $status) for $1"; return 1 ;;
              *) rm -f "$2"; echo "::warning::Remote Cache failed for $1 ($status); the build makes it, about an hour for the wasm packages" ;;
            esac
          }
          fetch "$WASM_KEY" "inputs/wasm-pkg/$WASM_KEY.tar"
          fetch "$CRATES_KEY" "inputs/default-crates/$CRATES_KEY.tar.gz"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-inputs
          path: inputs
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  # The PR's code, with no credential: no Vercel, Neon or Google secret, no
  # GitHub token beyond the checkout's, which is not kept, and no OIDC token.
  # What it hands on is the build output, as the artifact `preview-output`,
  # which `deploy` only uploads.
  build:
    name: build preview
    needs: prepare
    runs-on: ubuntu-latest
    # A cache archive `prepare` could not fetch is rebuilt here: the wasm
    # packages take about an hour.
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      # Fails the job if the workflow ever hands this job a credential.
      - name: No credential in the environment
        run: |
          found=""
          for name in VERCEL_TOKEN VERCEL_ARTIFACTS_TOKEN GH_TOKEN GITHUB_TOKEN NEON_API_KEY \
            ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL GOOGLE_APPLICATION_CREDENTIALS; do
            [ -z "${!name:-}" ] || found="$found $name"
          done
          [ -z "$found" ] || { echo "::error::the build job must hold no credential; set:$found"; exit 1; }
          echo "No credential in the build's environment."

      # The head commit, not the merge commit `pull_request` checks out by
      # default: the preview shows the branch as pushed. Submodule with full
      # history, as in client-v2.yml: update-static dates tutorials from it.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: true
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: client-v2/.nvmrc

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: preview-inputs
          path: ${{ runner.temp }}/inputs

      # Where vercel-install.sh's Build Cache lookups find the archives, so it
      # never asks the Remote Cache, which it has no token for.
      - name: Place the settings and caches
        env:
          INPUTS: ${{ runner.temp }}/inputs
        run: |
          mv "$INPUTS/.vercel" .vercel
          cache=client-v2/node_modules/.cache
          mkdir -p "$cache"
          for dir in wasm-pkg default-crates; do
            [ ! -d "$INPUTS/$dir" ] || mv "$INPUTS/$dir" "$cache/$dir"
          done

      # `vercel build` reads the settings and the environment `prepare`
      # pulled, and needs no token for it. --standalone copies every file a
      # function needs into its folder: without it a function names source
      # and node_modules files by their place in this checkout, which the
      # deploy job does not have.
      - name: Build
        run: |
          cli=$(sed -n 's/^VERCEL_CLI := //p' client-v2/Makefile.vercel)
          [ -n "$cli" ] || { echo "::error::no VERCEL_CLI in client-v2/Makefile.vercel"; exit 1; }
          # Separate lines: `-e` does not stop on a failure inside an && list.
          set -a
          . ./.vercel/.env.preview.local
          set +a
          npx --yes "$cli" build --standalone
          tar -czf "$RUNNER_TEMP/preview-output.tgz" .vercel/output .vercel/project.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-output
          path: ${{ runner.temp }}/preview-output.tgz
          retention-days: 1
          if-no-files-found: error

  # Uploads what `build` made. Runs nothing from the build: the archive is
  # unpacked into a folder of its own, checked to hold only the build output,
  # and sent to Vercel as it is.
  deploy:
    name: deploy preview
    needs: [database, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
      CLOUD_SQL_DATABASE: ${{ needs.database.outputs.cloud-sql-database }}
    steps:
      # Non-cone, as in `prepare`: no root files, so no .npmrc.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/
            /client-v2/Makefile.vercel

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: preview-output
          path: ${{ runner.temp }}

      # Unpacked into a folder of its own and checked before anything reads it:
      # no member path that climbs out or starts at the root, here, then
      # .github/scripts/preview-check-output.mjs on what was unpacked. The Root
      # Directory the settings pin must exist for the CLI, and stays empty.
      - name: Unpack and check the build output
        run: |
          archive="$RUNNER_TEMP/preview-output.tgz"
          # Their own lines, so a broken archive fails the step.
          names=$(tar -tzf "$archive")
          listing=$(tar -tvzf "$archive")
          climbing=$(grep -E '^/|(^|/)\.\.(/|$)' <<<"$names" || true)
          [ -z "$climbing" ] || { echo "::error::the build archive holds paths out of its folder: $(head -5 <<<"$climbing")"; exit 1; }
          # Unpacked, a hard link is a plain file the check below cannot tell apart.
          ! grep -q '^h' <<<"$listing" || { echo "::error::the build archive holds hard links"; exit 1; }
          mkdir -p "$RUNNER_TEMP/out"
          tar -xzf "$archive" -C "$RUNNER_TEMP/out" --no-same-owner --no-same-permissions
          node .github/scripts/preview-check-output.mjs "$RUNNER_TEMP/out"
          mkdir "$RUNNER_TEMP/out/client-v2"

      # The Git integration deploys an integration branch's push on its own,
      # on the shared database, and skips a ticket branch's
      # (client-v2/scripts/vercel-ignore-build.mjs); this deployment differs in
      # its database, the PR's own, and is a ticket branch's only preview. A
      # prebuilt deploy never runs the ignore step. DB_PROVIDER is given on
      # both paths, so the Preview environment's cannot pair one provider with
      # the other's database.
      - name: Deploy
        id: deploy
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          cli=$(sed -n 's/^VERCEL_CLI := //p' client-v2/Makefile.vercel)
          [[ "$cli" =~ ^vercel@[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
            { echo "::error::VERCEL_CLI in client-v2/Makefile.vercel is \"$cli\"; expected vercel@x.y.z"; exit 1; }
          if [ "$PREVIEW_DB_PROVIDER" = cloud-sql ]; then
            : "${CLOUD_SQL_DATABASE:?create-preview-db printed no CLOUD_SQL_DATABASE}"
            db_env=(-e DB_PROVIDER=cloud-sql -e CLOUD_SQL_DATABASE="$CLOUD_SQL_DATABASE")
          else
            db=$(bash .github/scripts/neon.sh uri "$BRANCH" pooled)
            echo "::add-mask::$db"
            db_env=(-e DB_PROVIDER=url -e DATABASE_URL="$db")
          fi
          unset NEON_API_KEY
          cd "$RUNNER_TEMP/out"
          # --archive=tgz: the prebuilt output is over the upload API's 15000-file cap.
          url=$(npx --yes "$cli" deploy --prebuilt --archive=tgz --token="$VERCEL_TOKEN" \
            "${db_env[@]}" --meta githubPrId="$PR" --meta githubCommitSha="$SHA")
          [ -n "$url" ] || { echo "::error::vercel deploy printed no URL"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Preview: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          if [ "$PREVIEW_DB_PROVIDER" = cloud-sql ]; then
            db="Cloud SQL database \`$CLOUD_SQL_DATABASE\` on the preview instance"
          else
            db="Neon branch \`$BRANCH\`"
          fi
          bash .github/scripts/preview-comment.sh "$PR" "**Preview:** $URL

          Commit \`${SHA::7}\`, database: $db, migrated. Remove the \`$PREVIEW_LABEL\` label or close the PR to drop the database."

  # Whichever job of the chain failed. Not on cancel: a newer push's run or
  # the teardown writes the comment.
  # TODO(HOO-2888 follow-up, Intake): a job that times out ends cancelled, so
  # it gets no comment either; the single job before the split had the same gap.
  report:
    name: report a failed preview
    needs: [database, keys, prepare, build, deploy]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/

      - name: Report the failure on the PR
        run: |
          bash .github/scripts/preview-comment.sh "$PR" "**Preview deploy failed** for commit \`${SHA::7}\`: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          An earlier preview, if any, still serves an earlier commit, and its database may be partly migrated."

  teardown:
    name: drop preview database
    # Runs only where PREVIEW_REPOSITORY names this repository and a provider
    # is configured (see the header). Not for a run Dependabot triggers: it
    # gets no NEON_API_KEY, and no OIDC token.
    if: >-
      (vars.PREVIEW_DB_PROVIDER == 'cloud-sql' || vars.NEON_PROJECT_ID != '') &&
      github.repository == vars.PREVIEW_REPOSITORY &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'closed' ||
       (github.event.action == 'unlabeled' && github.event.label.name == 'preview'))
    runs-on: ubuntu-latest
    # Above the deletes' worst case, four neon.sh `api()` calls of about 7
    # minutes each: a slow Neon then fails the step rather than timing out,
    # which cancels the job and skips the failure report.
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      # Sparse: only the scripts, not the submodule. The runner's own Node
      # runs preview-name.mjs.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            client-v2/scripts/db

      - name: Google Cloud credentials
        if: env.PREVIEW_DB_PROVIDER == 'cloud-sql'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_CI_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}

      - name: Install the Cloud SQL Auth Proxy
        if: env.PREVIEW_DB_PROVIDER == 'cloud-sql'
        run: bash .github/scripts/install-cloud-sql-proxy.sh

      # `with (force)` ends the sessions of the deployment still using it.
      # `name` is what the comments below call the database.
      - name: Drop the Cloud SQL database
        id: drop
        if: env.PREVIEW_DB_PROVIDER == 'cloud-sql'
        run: |
          name=$(node client-v2/scripts/db/preview-name.mjs --pr "$PR")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          bash client-v2/scripts/db/cloud-sql/drop-preview-db --pr "$PR"

      # `preview/<head branch>` is the name the Vercel integration gave a branch
      # before this workflow existed, and the one neon-preview-branch.sh (`make
      # deploy-client-to-vercel-preview`) still gives, so it is cleaned up too.
      # Except where that name means something else: `pr-<n>` would be another
      # PR's live preview, and `preview/master` is the production dry run's
      # branch (deploy-client-vercel.md). Each delete runs even if the other
      # fails; `failed` names the branches left, for the failure report.
      - name: Delete the Neon branches
        id: delete
        if: env.PREVIEW_DB_PROVIDER != 'cloud-sql'
        run: |
          failed=""
          bash .github/scripts/neon.sh delete "$BRANCH" || failed="\`$BRANCH\`"
          if [[ "$HEAD_REF" =~ ^(pr-[0-9]+|master)$ ]]; then
            echo "keeping preview/$HEAD_REF: not this PR's to delete"
          else
            bash .github/scripts/neon.sh delete "preview/$HEAD_REF" ||
              failed="${failed:+$failed and }\`preview/$HEAD_REF\`"
          fi
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          [ -z "$failed" ]

      # `--edit-only`: a PR that never had a preview gets no comment. Runs only
      # on success, so a failed delete gets the failure report instead.
      - name: Update the PR comment
        env:
          DROPPED: ${{ steps.drop.outputs.name }}
        run: |
          bash .github/scripts/preview-comment.sh --edit-only "$PR" "Preview database \`${DROPPED:-$BRANCH}\` deleted. The last deployment still loads but has no database; add the \`$PREVIEW_LABEL\` label again to redeploy."

      # Not on cancel: a newer run for the same PR cancels this one through
      # the concurrency group and writes the comment itself, which a report
      # on cancel would overwrite. Without `--edit-only`: a PR with no preview
      # comment still gets the report.
      - name: Report the failure on the PR
        if: failure()
        env:
          DELETE_OUTCOME: ${{ steps.delete.outcome }}
          DROP_OUTCOME: ${{ steps.drop.outcome }}
          DROP_NAME: ${{ steps.drop.outputs.name }}
          FAILED: ${{ steps.delete.outputs.failed }}
        run: |
          if [ "$PREVIEW_DB_PROVIDER" = cloud-sql ]; then
            case "$DROP_OUTCOME" in
              success) detail="The database was dropped; a later step failed." ;;
              failure) detail="Not dropped: \`${DROP_NAME:-solpg_preview_pr_$PR}\`. Re-run the failed job; the daily preview-sweep.yml run also drops it once the PR is closed or unlabelled." ;;
              *) detail="The run failed before the drop, so nothing was dropped. Re-run the failed job; the daily preview-sweep.yml run also drops it once the PR is closed or unlabelled." ;;
            esac
            bash .github/scripts/preview-comment.sh "$PR" "**Preview teardown failed**: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          $detail"
            exit 0
          fi
          remedy="Re-run the failed job. Once the PR is closed, a manual preview-sweep.yml run with scope \`all-preview\` and \`dry_run\` unticked (\"List what would be deleted, delete nothing\") also deletes \`preview/<head branch>\`; the daily sweep deletes \`$BRANCH\` on its own."
          case "$DELETE_OUTCOME" in
            success) detail="The Neon branches were deleted; a later step failed." ;;
            failure) detail="Not deleted: ${FAILED:-unknown}. $remedy" ;;
            *) detail="The run failed before the deletes, so nothing was deleted. $remedy" ;;
          esac
          bash .github/scripts/preview-comment.sh "$PR" "**Preview teardown failed**: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          $detail"

  # Without this job a half-configured repository skips `deploy` silently.
  configuration:
    name: check preview configuration
    if: >-
      (vars.PREVIEW_DB_PROVIDER == 'cloud-sql' || vars.NEON_PROJECT_ID != '') &&
      github.repository != vars.PREVIEW_REPOSITORY &&
      contains(github.event.pull_request.labels.*.name, 'preview') &&
      (contains(fromJSON('["opened", "reopened", "synchronize"]'), github.event.action) ||
       (github.event.action == 'labeled' && github.event.label.name == 'preview'))
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - run: echo "::warning::Previews are half-configured; PREVIEW_DB_PROVIDER or NEON_PROJECT_ID is set, but PREVIEW_REPOSITORY is unset or names another repository (client-v2/docs/preview-databases.md, \"Configuration\")."

  # The Git integration's preview of an integration branch reads the shared
  # database, which carries only the migrations on master
  # (preview-shared-db.yml). A PR from one that changes a migration is told
  # so, with the label as the remedy; a ticket branch gets no such preview,
  # so nothing to warn about. The label's deploy
  # then overwrites this comment. Fork and Dependabot PRs get a read-only
  # token, so the notice goes to the job summary instead.
  migration-notice:
    name: check for migrations
    if: >-
      vars.PREVIEW_DB_PROVIDER == 'cloud-sql' && github.repository == vars.PREVIEW_REPOSITORY &&
      !contains(github.event.pull_request.labels.*.name, 'preview') &&
      contains(fromJSON('["opened", "reopened", "synchronize"]'), github.event.action)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      READ_ONLY: ${{ github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]' }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            client-v2/scripts

      # Asks vercel.json's ignoreCommand itself, so the rule lives in one
      # place: it exits 0 to skip a branch. Any other exit, a crash included,
      # reads as an integration branch and runs the check.
      - name: Is the head an integration branch
        id: integration
        run: |
          if VERCEL_GIT_COMMIT_REF=$HEAD_REF VERCEL_ENV=preview node client-v2/scripts/vercel-ignore-build.mjs; then
            echo "The Git integration builds no preview of $HEAD_REF; nothing reads the shared database for it."
            echo "integration=false" >> "$GITHUB_OUTPUT"
          else
            echo "integration=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Look for migrations
        if: steps.integration.outputs.integration == 'true'
        env:
          # How the notice starts, so a later run can tell it from the
          # deploy's and the teardown's comments
          NOTICE: "**This PR changes migrations.**"
        run: |
          # The REST list pages to 3000 files; `gh pr view --json files` stops at 100.
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
          migrations=$(grep '^client-v2/db/migrations/' <<<"$files" || true)
          if [ -z "$migrations" ]; then
            echo "No file under client-v2/db/migrations changed."
            # A notice from an earlier push no longer holds; any other
            # comment is left as it is
            [ "$READ_ONLY" = true ] ||
              bash .github/scripts/preview-comment.sh --replace-if "$NOTICE" "$PR" \
                "This PR no longer changes migrations, so its automatic preview on the shared database \`solpg_preview\` has the schema it expects."
            exit 0
          fi
          # Literal backticks, one Markdown list item per path
          # shellcheck disable=SC2001,SC2016
          list=$(sed 's/.*/- `&`/' <<<"$migrations")
          body="$NOTICE Its automatic preview reads the shared preview database \`solpg_preview\`, which has only the migrations on \`master\`, so it may fail where the PR's code expects these:

          $list

          Add the \`$PREVIEW_LABEL\` label for a preview with a database of its own, migrated on every push and dropped when the label goes or the PR closes."
          if [ "$READ_ONLY" = true ]; then
            echo "::warning::This PR changes migrations; its automatic preview runs on the shared database without them. Ask a maintainer for the $PREVIEW_LABEL label."
            printf '%s\n' "$body" >> "$GITHUB_STEP_SUMMARY"
          else
            bash .github/scripts/preview-comment.sh "$PR" "$body"
          fi
