name: client-v2

# Guards `client-v2/` on the real wasm packages, the ones every deployment
# ships, and never touches the Rust workspaces otherwise. The jobs live in
# `reusable-client-v2.yml`; `client-v2-with-stubs.yml` runs the same jobs on
# the stubs, by hand. A pull_request run reads this file from the PR's merge
# commit (CLAUDE.md, "This is a fork").
on:
  push:
    branches: ["master"]
  pull_request:

  workflow_dispatch:

concurrency:
  group: client-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Named `client-v2` so its jobs report as `client-v2 / <job>`.
  pipeline:
    name: client-v2
    uses: ./.github/workflows/reusable-client-v2.yml
    with:
      use-wasm-stubs: false

  # After a push to `master`, fails unless that commit's production
  # deployment answers `{ "enabled": true, "db": "ok" }` on `GET /api/sync`:
  # a database production cannot reach otherwise leaves every user local with
  # nobody told (HOO-2536). Not in `needs` of `client-v2` below:
  # that job gates pull requests, where this one is skipped and a skipped
  # needed job reads as red. A red `smoke` still turns the run on `master` red.
  #
  # The Vercel GitHub app records each deployment on the commit as a GitHub
  # deployment (environment `Production`) with statuses, so the commit's
  # deployment and its URL come from the GitHub API with the run's own token,
  # and no Vercel token is needed. The per-deployment URL sits behind
  # Deployment Protection (it answers a redirect or a 401 to the login page), so the probe
  # sends Vercel's Protection Bypass for Automation secret, repository secret
  # `VERCEL_AUTOMATION_BYPASS_SECRET`. Without it the job passes, but with a
  # warning annotation and a summary entry saying production was not checked.
  #
  # `db: "ok"` is what `/api/sync` reports after `select 1`: this proves the
  # connection, not that migrations were applied ("migrate first, then merge").
  #
  # The repository guard keeps the hoodieshq fork's pushes to its own `master`
  # from waiting for a deployment that does not exist.
  smoke:
    name: smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'solana-foundation/solana-playground'
    runs-on: ubuntu-latest
    # 30 minutes of waiting for the deployment, one for the probe. A build
    # without a cache does not finish inside Vercel's own limit
    # (deploy-client-vercel.md, "Deploy"), so the wait is generous.
    timeout-minutes: 35
    permissions:
      contents: read
      deployments: read
    env:
      SMOKE_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

    steps:
      - name: Check the bypass secret is set
        id: gate
        run: |
          if [ -n "$SMOKE_BYPASS_SECRET" ]; then
            echo "armed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::smoke skipped: repository secret VERCEL_AUTOMATION_BYPASS_SECRET is not set, so production's database was NOT checked"
            echo "### Smoke SKIPPED: VERCEL_AUTOMATION_BYPASS_SECRET is not set; production's database was not checked" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: steps.gate.outputs.armed == 'true'
        with:
          sparse-checkout: |
            client-v2/scripts/smoke-sync.mjs
            client-v2/.nvmrc
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        if: steps.gate.outputs.armed == 'true'
        with:
          node-version-file: client-v2/.nvmrc

      # The newest status of the commit's `Production` deployment decides:
      # `success` carries the URL; `failure`, `error` or `inactive` (superseded
      # by a newer production deployment) ends the wait as a red run; anything
      # else is a build still going.
      - name: Wait for the commit's production deployment
        id: deployment
        if: steps.gate.outputs.armed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          deadline=$((SECONDS + 1800))
          state=none
          api_failures=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            # A GitHub API error is retried, not fatal; three in a row end the wait.
            if ! id=$(gh api "repos/$REPO/deployments?sha=$SHA&environment=Production" \
              --jq 'map(select(.creator.login == "vercel[bot]")) | .[0].id // empty'); then
              api_failures=$((api_failures + 1))
              if [ "$api_failures" -ge 3 ]; then
                echo "::error::the GitHub API failed three times in a row while looking for the production deployment of $SHA"
                echo "### Smoke FAILED: the GitHub API failed three times in a row while looking for the production deployment of \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"
                exit 1
              fi
              sleep 20
              continue
            fi
            if [ -n "$id" ]; then
              # Unit separator, not a tab: tab is IFS whitespace, so an empty field would shift the next one left.
              if ! row=$(gh api "repos/$REPO/deployments/$id/statuses" \
                --jq '.[0] // {} | [(.state // "pending"), (.environment_url // .target_url // "-"), (.description // "-")] | join("\u001f")'); then
                api_failures=$((api_failures + 1))
                if [ "$api_failures" -ge 3 ]; then
                  echo "::error::the GitHub API failed three times in a row while reading the status of deployment $id"
                  echo "### Smoke FAILED: the GitHub API failed three times in a row while reading the status of deployment $id" >> "$GITHUB_STEP_SUMMARY"
                  exit 1
                fi
                sleep 20
                continue
              fi
              api_failures=0
              IFS=$'\x1f' read -r state url description <<< "$row"
              echo "deployment $id: $state"
              case "$state" in
                success)
                  echo "url=$url" >> "$GITHUB_OUTPUT"
                  exit 0 ;;
                failure|error|inactive)
                  echo "::error::Vercel's production deployment of $SHA ended as '$state' (a deployment problem, the database was not probed): $description ($url)"
                  echo "### Smoke FAILED: Vercel's production deployment of \`$SHA\` ended as \`$state\` (a deployment problem, the database was not probed): $description ($url)" >> "$GITHUB_STEP_SUMMARY"
                  exit 1 ;;
              esac
            else
              echo "no Production deployment of $SHA yet"
            fi
            sleep 20
          done
          echo "::error::no successful Vercel production deployment of $SHA within 30 minutes (last state: $state)"
          echo "### Smoke FAILED: no successful Vercel production deployment of \`$SHA\` within 30 minutes (last state: \`$state\`)" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # Names the URL and the body in the log and the run summary.
      - name: Probe GET /api/sync
        if: steps.gate.outputs.armed == 'true'
        run: node client-v2/scripts/smoke-sync.mjs "$DEPLOYMENT_URL"
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.url }}

  # The status context the default branch's ruleset names (`client-v2`).
  # It sees only the called workflow's conclusion, which counts a skipped
  # job as success, so the `gate` job of `reusable-client-v2.yml` fails that
  # workflow on a skip it does not expect. `always()` because a job whose
  # `needs` failed is skipped, and GitHub reads a skipped required check as
  # passing. An empty `needs` fails rather than passes.
  client-v2:
    name: client-v2
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [pipeline]
    if: always()
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          [ -n "$RESULTS" ] || exit 1
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
