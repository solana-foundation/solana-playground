name: client-v2

# The fork's frontend checks. ci.yml checks formatting and clippy, not
# `client/`'s build or tests; this one guards `client-v2/` and never touches
# the Rust workspaces. Keep the branch list identical on master and new-face,
# so a merge in either direction leaves it unchanged.
on:
  push:
    branches: ["master", "new-face"]
  pull_request:
    branches: ["master", "new-face"]

  workflow_dispatch:

concurrency:
  group: client-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      # The API suite's integration cases skip themselves without this, so
      # without it they would pass by not running.
      #
      # `sslmode=disable` is an explicit opt-out, not a workaround: this
      # service container serves no TLS at all. Both dbmate and the app
      # otherwise require an encrypted, verified connection, which is what a
      # real database gets.
      DATABASE_URL: postgres://solpg:solpg@localhost:5432/solpg?sslmode=disable

    # Ours, not the Rust server's MongoDB -- that one is untouched and is not
    # needed here.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: solpg
          POSTGRES_PASSWORD: solpg
          POSTGRES_DB: solpg
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: client-v2

    steps:
      # `client-v2/public` is not tracked: scripts/update-static.mjs copies
      # it out of the `client/public` submodule and dates each tutorial
      # from that submodule's history, so the submodule is checked out
      # with full history.
      - uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: client-v2/.nvmrc
          cache: "yarn"
          cache-dependency-path: "client-v2/yarn.lock"

      # Six of the eight local `wasm/*/pkg` deps are compiled from Rust
      # (about an hour). `yarn install` refuses to run while the
      # directories are missing, so stand them in; none is on the UI or
      # test path.
      - name: Stub the unbuilt WASM packages
        run: ../wasm/stub-packages.sh

      - name: Install
        run: yarn install --frozen-lockfile

      # Same cheap chain as `yarn dev`: static assets, export barrels,
      # package and tutorial data, assistant context, so type-check and tests
      # see the generated files. The `build` job regenerates them in `build-fast`.
      - name: Generate
        run: yarn generate-fast

      # Pinned rather than `latest`: a migration tool that changes under CI
      # without anyone asking is a bad trade for the few seconds saved.
      - name: Install dbmate
        run: |
          curl -fsSL -o /usr/local/bin/dbmate \
            https://github.com/amacneil/dbmate/releases/download/v2.35.1/dbmate-linux-amd64
          chmod +x /usr/local/bin/dbmate

      # Applied explicitly, never from a function. This also proves the
      # migrations actually run from scratch, which a database that is only
      # ever migrated forward locally does not.
      - name: Apply migrations
        run: yarn db-migrate

      # db/schema.sql is derived from db/migrations/, and a stale one misleads
      # every reviewer -- it is the file people actually read. Regenerating it
      # from the migrations just applied proves it still matches. `db-dump`
      # takes pg_dump from the postgres:16 image here too, so its output matches
      # a local re-dump byte for byte.
      - name: Check db/schema.sql is current
        run: |
          yarn db-dump
          git diff --exit-code -- db/schema.sql || {
            echo "::error::db/schema.sql is stale -- run 'yarn db-dump' and commit the result"
            exit 1
          }

      - name: Check types
        run: yarn test-types

      - name: Check format
        run: yarn check-format

      - name: Check Markdown
        run: yarn check-md

      # The production build lints only what webpack bundles. This step also
      # covers tests, `api/` and `e2e/`. Only errors fail it: the review
      # rules in `eslintConfig` are errors, and the legacy code still holds
      # warnings, so they print without failing.
      - name: Lint
        run: yarn lint

      # Every colour comes from the design system's tokens; a hex or a
      # colour function anywhere else in `src/` fails the job.
      - name: Colour literals
        run: yarn check-colors

      # `openspec validate --all` over ../openspec: every active change has
      # its proposal, delta specs, design and tasks in the schema's shape.
      - name: Validate specs
        run: yarn spec:validate

      # Report only: which scenarios have neither a browser test nor a
      # `(manual)` mark. `--strict` is for when the list is empty.
      - name: Scenario coverage
        run: yarn spec:coverage

      - name: Unit tests
        run: yarn test-unit

      # A dropped `includeSource` in vitest.config.ts removes 53 modules' in-source
      # tests and keeps the suite green, so one block's title is looked up in
      # what vitest collects.
      - name: Check in-source tests are collected
        run: |
          yarn vitest list src/shared/lib/ids.ts | grep -qF "mints a v4 without crypto.randomUUID, which insecure origins lack" || {
            echo "::error::the in-source block of src/shared/lib/ids.ts is not collected: includeSource in vitest.config.ts no longer applies"
            exit 1
          }

      # `node --test`, not vitest: `api/*.mjs` and the `.mjs` modules
      # behind each feature's `server.mjs` are plain ESM outside the
      # TypeScript build and need real Node.
      - name: API tests
        run: yarn test-api

  # The production build and the checks on what it emits; the `client-v2` job fails when it does.
  build:
    uses: ./.github/workflows/reusable-client-v2-build.yml

  # The browser suite (`client-v2/e2e/`, Playwright) in its own job, so
  # `checks` stays short and a browser failure reads as one. No Postgres and
  # no secret: every spec stubs the account endpoints with `page.route`, and
  # the dev server serves `api/*.mjs` itself. The skips the job expects are
  # listed in `e2e/known-skips.txt`; `playwright.config.mts` says what `CI`
  # changes.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    # Measured locally at under five minutes for the suite plus a minute of
    # dev-server boot (the dated number is in D61); a 2-vCPU runner is two to
    # three times slower, so this is generous rather than tight. A genuine
    # hang still fails, just later.
    timeout-minutes: 30

    defaults:
      run:
        working-directory: client-v2

    steps:
      # Same checkout as `checks`: `client-v2/public` is generated out of the
      # `client/public` submodule, dated from its history.
      - uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: client-v2/.nvmrc
          cache: "yarn"
          cache-dependency-path: "client-v2/yarn.lock"

      - name: Stub the unbuilt WASM packages
        run: ../wasm/stub-packages.sh

      - name: Install
        run: yarn install --frozen-lockfile

      # The browser binary is cached by Playwright version, so only a bump
      # re-downloads it. The runner's system libraries are not cached: on a
      # hit they are installed alone (`install-deps`), on a miss together
      # with the browser (`--with-deps`).
      #
      # restore + save rather than `actions/cache`, whose post step saves
      # only when the job succeeds: while the suite is red, every run would
      # download Chromium again, and a red suite is when runs are frequent.
      - name: Playwright version
        id: playwright
        run: echo "version=$(jq -r .version node_modules/@playwright/test/package.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: yarn playwright install --with-deps chromium

      - uses: actions/cache/save@v6
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: yarn playwright install-deps chromium

      # `yarn dev` runs `generate-fast` itself before `craco start`, and the
      # config starts it (`webServer`), so there is no separate generate step.
      - name: Browser tests
        run: yarn test-e2e

      # A skipped test is green to Playwright, and so is one that passed on
      # its retry; the reporters name neither. Both are read from the json
      # report: a skip outside `e2e/known-skips.txt` fails the job, a listed
      # test that no longer skips is a warning to prune the list, and a
      # flaky test is a warning with its title -- work to do, not a pass.
      - name: Check skips against the known list
        if: always()
        run: |
          report=test-results/report.json
          [ -f "$report" ] || { echo "::error::no $report -- the suite did not run to a report"; exit 1; }
          titles() { jq -r --arg s "$1" '.. | objects | select(has("tests")) | select(any(.tests[]; .status == $s)) | .title' "$report" | sort; }
          grep -v '^#' e2e/known-skips.txt | sed '/^$/d' | sort > /tmp/known-skips
          titles skipped > /tmp/skipped
          comm -13 /tmp/known-skips /tmp/skipped | while read -r t; do echo "::error title=unexpected e2e skip::$t -- not in e2e/known-skips.txt"; done
          comm -23 /tmp/known-skips /tmp/skipped | while read -r t; do echo "::warning title=stale known skip::$t -- listed in e2e/known-skips.txt but ran"; done
          titles flaky | while read -r t; do echo "::warning title=flaky e2e test::$t -- failed once on this runner, passed on retry; its trace is in the artifact"; done
          [ -z "$(comm -13 /tmp/known-skips /tmp/skipped)" ]

      # Traces, screenshots and the per-test error context of what failed.
      # Open a trace with `yarn playwright show-trace <file>`. `always()`,
      # not `failure()`: a run that `timeout-minutes` cancels is the one whose
      # trace matters most, and `failure()` does not fire for it. On a green
      # run the directory holds the json report and little else.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-test-results
          path: client-v2/test-results/
          retention-days: 7
          if-no-files-found: warn

  # The one status the default branch's ruleset requires (context
  # `client-v2`), so a job added to or renamed in this workflow needs no
  # ruleset edit: list it in `needs` and this job passes only when it
  # succeeded. `always()` because a job whose `needs` failed is skipped, and
  # GitHub reads a skipped required check as passing.
  client-v2:
    name: client-v2
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [checks, build, e2e]
    if: always()
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
