name: client-v2

# Guards `client-v2/` on the real wasm packages, the ones every deployment
# ships, and never touches the Rust workspaces otherwise. The jobs live in
# `reusable-client-v2.yml`; `client-v2-with-stubs.yml` runs the same jobs on
# the stubs, by hand. A pull_request run reads this file from the PR's merge
# commit (CLAUDE.md, "This is a fork").
on:
  push:
    branches: ["master"]
  pull_request:

  workflow_dispatch:

concurrency:
  group: client-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Named `client-v2` so its jobs report as `client-v2 / <job>`.
  pipeline:
    name: client-v2
    uses: ./.github/workflows/reusable-client-v2.yml
    with:
      use-wasm-stubs: false

  # The status context the default branch's ruleset names (`client-v2`).
  # It sees only the called workflow's conclusion, which counts a skipped
  # job as success, so the `gate` job of `reusable-client-v2.yml` fails that
  # workflow on a skip it does not expect. `always()` because a job whose
  # `needs` failed is skipped, and GitHub reads a skipped required check as
  # passing. An empty `needs` fails rather than passes.
  client-v2:
    name: client-v2
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [pipeline]
    if: always()
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          [ -n "$RESULTS" ] || exit 1
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
