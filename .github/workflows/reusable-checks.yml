name: "Upstream: reusable checks"

# Reusable workflow shared by ci.yml (PR and master-push validation) and
# cicd.yml (master deploy gate). Holds the format, clippy, and build steps
# once, so ci.yml and cicd.yml run the same checks.
on:
  workflow_call:
    inputs:
      # The `build` job: `yarn setup` (the WASM compile), then type check,
      # unit tests and production build of upstream's `client/`, 20+ minutes.
      # ci.yml turns the `build` job off, so PRs and untagged pushes to master
      # never check `client/`, which this fork does not edit. cicd.yml runs the
      # `build` job on a tagged push to master and on a manual dispatch. The
      # WASM still compiles for a preview, in vercel-install.sh, when the wasm
      # packages miss both the Build Cache and the Remote Cache.
      build:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  format_client:
    name: Format client
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: client/.nvmrc
          cache: "yarn"
          cache-dependency-path: "client/yarn.lock"

      # Make the locked prettier resolvable on PATH (no global install,
      # no full `yarn install`), then run the package.json script so
      # CI mirrors local dev exactly.
      - name: Check format
        run: |
          prettier_version=$(awk "/^prettier/{getline; print}" yarn.lock | cut -d "\"" -f 2)
          npx --yes --package=prettier@$prettier_version -- yarn check-format

  format_server:
    name: Format server
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Server fmt needs nightly (rustfmt.toml uses nightly-only options); the
      # rest of the toolchain is pinned by the workspace rust-toolchain.toml.
      - name: Add rustfmt (nightly)
        run: rustup component add --toolchain nightly rustfmt

      - name: Check format
        run: cargo +nightly fmt --check

  format_wasm:
    name: Format WASM
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: wasm

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Toolchain + rustfmt come from wasm/rust-toolchain.toml.
      - name: Check format
        run: cargo fmt --check

  clippy_server:
    name: Clippy Server
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: format_server

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Add clippy
        run: rustup component add clippy

      - name: Check clippy warnings
        run: cargo clippy --all-targets -- -D warnings

  clippy_wasm:
    name: Clippy WASM
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: format_wasm

    defaults:
      run:
        working-directory: wasm

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # clippy isn't in wasm/rust-toolchain.toml's components; add it to the
      # pinned toolchain, which cargo selects via the toml.
      - name: Add clippy
        run: rustup component add clippy

      - name: Check clippy warnings
        run: cargo clippy --all-targets -- -D warnings

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: inputs.build
    needs:
      [format_client, format_server, format_wasm, clippy_server, clippy_wasm]

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: client/.nvmrc
          cache: "yarn"
          cache-dependency-path: "client/yarn.lock"

      - name: Sync rust-toolchain
        run: rustc --version

      # `wasm/rust-analyzer` and `wasm/rustfmt` sit outside the wasm workspace with their own target dirs; list them so rust-cache picks each up.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            wasm
            wasm/rust-analyzer
            wasm/rustfmt

      - name: Setup
        run: yarn setup

      # This confirms that there are no changes after setup script runs
      - name: Check git status
        run: git status --porcelain | wc -l | grep -q -w "0"

      # Unlike the build, `tsc --noEmit` also covers test files.
      - name: Check types
        run: yarn test-types

      - name: Run unit tests
        run: yarn test-unit

      - name: Build
        run: yarn build
