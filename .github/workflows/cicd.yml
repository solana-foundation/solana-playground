name: "Server: deploy"

on:
  push:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Resolve the App Engine version from the tag at HEAD. Push to master deploys
  # only when that commit is tagged; manual dispatch falls back to the latest
  # reachable tag so it always has a version to deploy.
  resolve_version:
    name: Resolve deploy version
    runs-on: ubuntu-latest
    outputs:
      version_tag: ${{ steps.tag.outputs.version_tag }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: tag
        name: Compute App Engine version tag
        run: |
          # Only solana-foundation/solana-playground (id 1003072868) deploys: forks such as hoodieshq hold no GCP access.
          # A push there stays green with nothing to deploy; a dispatch there fails, so it does not read as a deploy.
          if [ "$GITHUB_REPOSITORY_ID" != "1003072868" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::Deploy from solana-foundation/solana-playground; $GITHUB_REPOSITORY deploys nothing." >&2
              exit 1
            fi
            echo "::notice::$GITHUB_REPOSITORY deploys nothing; only solana-foundation/solana-playground does."
            echo "version_tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Tags are already present from checkout (fetch-depth: 0); no network fetch needed.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual deploy: use the latest reachable tag; fail loudly rather than deploy a sentinel version.
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
            if [ -z "$TAG" ]; then
              echo "::error::No git tag found to derive a deploy version; create a tag before dispatching." >&2
              exit 1
            fi
          else
            TAG=$(git describe --tags --exact-match 2>/dev/null || true)
          fi
          # Replace periods with dashes for App Engine compatibility (empty stays empty)
          echo "version_tag=${TAG//./-}" >> "$GITHUB_OUTPUT"

  checks:
    needs: resolve_version
    if: needs.resolve_version.outputs.version_tag != ''
    uses: ./.github/workflows/reusable-checks.yml # zizmor: ignore[self-repository] act rejects the $/ form, and both resolve to this commit

  deploy_server:
    name: Deploy Playground Server
    runs-on: ubuntu-latest
    needs:
      - resolve_version
      - checks
    if: needs.resolve_version.outputs.version_tag != ''
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Sign in to GCP
        uses: ./.github/actions/gcp-auth # zizmor: ignore[self-repository] act rejects the $/ form, and both resolve to this commit
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}
          credentials_json: ${{ secrets.GCP_KEY }}
          project_id: ${{ secrets.PROJECT_ID }}

      - name: Deploy to App Engine with specific version (no promote)
        working-directory: server
        env:
          VERSION_TAG: ${{ needs.resolve_version.outputs.version_tag }}
        run: |
          # Rust release build alone is ~6m; full image build runs ~10.5m, past
          # the 600s Cloud Build default. Raise the cap so the image can be pushed.
          gcloud config set app/cloud_build_timeout 1800
          gcloud app deploy app.yaml \
            --version="$VERSION_TAG" \
            --no-promote \
            --quiet
