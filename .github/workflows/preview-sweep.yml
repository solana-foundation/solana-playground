name: preview-sweep

# The safety net under preview.yml: deletes the preview databases no open,
# labelled PR still needs. preview.yml drops one on close or unlabel, but a
# cancelled or failed teardown leaves one behind.
#
# With PREVIEW_DB_PROVIDER `cloud-sql`, it drops `solpg_preview_pr_<n>` on the
# preview instance, and nothing else there: not the shared `solpg_preview`,
# not a laptop's `solpg_preview_br_*`
# (client-v2/scripts/db/cloud-sql/list-preview-dbs lists PR databases only).
# The `scope` input does not apply.
#
# Unset, it deletes Neon branches, every one of which counts against the
# project's branch cap.
#
# Scope `managed` (the schedule) touches only `preview/pr-<n>`, the names
# preview.yml creates. Scope `all-preview` also takes any other `preview/*`
# branch -- those the Vercel integration created per git branch before its
# option was turned off, and those `make deploy-client-to-vercel-preview` cuts
# per local branch -- unless an open PR still has that head branch. Neither
# scope touches `main` (the default branch), a protected one, or
# `preview/master`, the production dry run's branch
# (deploy-client-vercel.md), which preview.yml's teardown keeps too.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      scope:
        description: "managed: preview/pr-<n> only. all-preview: every preview/* branch"
        type: choice
        options: [managed, all-preview]
        default: managed
      dry_run:
        description: "List what would be deleted, delete nothing"
        type: boolean
        default: true

permissions: {}

defaults:
  run:
    # Explicit, for pipefail: the implicit default runs `bash -e` without it.
    shell: bash

concurrency:
  group: preview-sweep

jobs:
  sweep:
    name: sweep preview branches
    # Runs only where PREVIEW_REPOSITORY names this repository and a provider
    # is configured (see preview.yml's header).
    if: >-
      (vars.PREVIEW_DB_PROVIDER == 'cloud-sql' || vars.NEON_PROJECT_ID != '') &&
      github.repository == vars.PREVIEW_REPOSITORY
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      PREVIEW_DB_PROVIDER: ${{ vars.PREVIEW_DB_PROVIDER }}
      CLOUD_SQL_INSTANCE: ${{ vars.PREVIEW_CLOUD_SQL_INSTANCE }}
      CLOUD_SQL_USER: ${{ vars.PREVIEW_CLOUD_SQL_USER }}
      CLOUD_SQL_LOGIN_USER: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      GH_TOKEN: ${{ github.token }}
      # A scheduled run has no inputs: it deletes, managed scope only.
      SCOPE: ${{ inputs.scope || 'managed' }}
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
      # Must match preview.yml's: a stale name keeps no preview alive.
      PREVIEW_LABEL: preview
      # A branch younger than this may belong to a deploy that started after
      # the PR list below was read.
      MIN_AGE_MINUTES: 60
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github/scripts
            client-v2/scripts/db

      - name: Google Cloud credentials
        if: env.PREVIEW_DB_PROVIDER == 'cloud-sql'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_CI_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}

      - name: Install the Cloud SQL Auth Proxy
        if: env.PREVIEW_DB_PROVIDER == 'cloud-sql'
        run: bash .github/scripts/install-cloud-sql-proxy.sh

      - name: Open PRs
        run: |
          limit=1000
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit "$limit" \
            --json number,headRefName,labels > prs.json
          # A truncated list would read as closed PRs, and their previews go.
          if [ "$(jq length prs.json)" -ge "$limit" ]; then
            echo "::error::$limit or more open PRs; raise the limit before sweeping"
            exit 1
          fi

      # A listing that fails fails the step before anything is dropped.
      - name: Sweep Cloud SQL databases
        if: env.PREVIEW_DB_PROVIDER == 'cloud-sql'
        run: |
          keep=$(jq -r --arg l "$PREVIEW_LABEL" '.[] | select(any(.labels[]; .name == $l)) | .number' prs.json)
          bash client-v2/scripts/db/cloud-sql/list-preview-dbs > dbs.txt
          deleted=0 kept=0 failed=0
          while read -r pr age; do
            name=solpg_preview_pr_$pr
            # An age that is not a number (no creation stamp) is kept, never read as old.
            if grep -qxF "$pr" <<<"$keep" || ! [[ "$age" =~ ^[0-9]+$ ]] || [ "$age" -lt "$MIN_AGE_MINUTES" ]; then
              kept=$((kept + 1))
              continue
            fi
            if [ "$DRY_RUN" = true ]; then
              echo "would drop $name (age ${age}m)"
            elif ! bash client-v2/scripts/db/cloud-sql/drop-preview-db --pr "$pr"; then
              # One failure must not stop the rest of the sweep.
              echo "::warning::could not drop $name"
              failed=$((failed + 1))
              continue
            fi
            deleted=$((deleted + 1))
          done < dbs.txt

          verb=$([ "$DRY_RUN" = true ] && echo "Would drop" || echo "Dropped")
          echo "$verb $deleted preview databases, kept $kept, failed $failed; $(wc -l < dbs.txt) PR databases on the instance before the sweep." | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$failed" -eq 0 ]

      - name: Sweep Neon branches
        if: env.PREVIEW_DB_PROVIDER != 'cloud-sql'
        run: |
          # PRs whose preview/pr-<n> is live, and head branches with an open PR.
          keep_managed=$(jq -r --arg l "$PREVIEW_LABEL" '.[] | select(any(.labels[]; .name == $l)) | "preview/pr-\(.number)"' prs.json)
          keep_legacy=$(jq -r '.[] | "preview/\(.headRefName)"' prs.json)

          bash .github/scripts/neon.sh list > branches.txt
          deleted=0 kept=0 failed=0
          while read -r name age; do
            if [[ "$name" =~ ^preview/pr-[0-9]+$ ]]; then
              keep=$keep_managed
            elif [ "$name" = preview/master ]; then
              echo "keep $name (the production dry run's branch)"
              kept=$((kept + 1))
              continue
            elif [[ "$name" == preview/* ]]; then
              if [ "$SCOPE" != all-preview ]; then
                echo "skip $name (not managed; run with scope all-preview to include it)"
                continue
              fi
              keep=$keep_legacy
            else
              continue
            fi
            # An age that is not a number is kept, never read as old.
            if grep -qxF "$name" <<<"$keep" || ! [[ "$age" =~ ^[0-9]+$ ]] || [ "$age" -lt "$MIN_AGE_MINUTES" ]; then
              kept=$((kept + 1))
              continue
            fi
            if [ "$DRY_RUN" = true ]; then
              echo "would delete $name (age ${age}m)"
            elif ! bash .github/scripts/neon.sh delete "$name"; then
              # One failure must not stop the rest of the sweep.
              echo "::warning::could not delete $name"
              failed=$((failed + 1))
              continue
            fi
            deleted=$((deleted + 1))
          done < branches.txt

          verb=$([ "$DRY_RUN" = true ] && echo "Would delete" || echo "Deleted")
          echo "$verb $deleted preview branches, kept $kept, failed $failed; $(wc -l < branches.txt) unprotected branches in the project before the sweep." | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$failed" -eq 0 ]

  # Without this job a half-configured repository skips `sweep` silently.
  configuration:
    name: check preview configuration
    if: >-
      (vars.PREVIEW_DB_PROVIDER == 'cloud-sql' || vars.NEON_PROJECT_ID != '') &&
      github.repository != vars.PREVIEW_REPOSITORY
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - run: echo "::warning::Previews are half-configured; PREVIEW_DB_PROVIDER or NEON_PROJECT_ID is set, but PREVIEW_REPOSITORY is unset or names another repository (client-v2/docs/preview-databases.md, \"Configuration\")."
