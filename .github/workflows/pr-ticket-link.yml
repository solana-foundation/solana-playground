name: pr-ticket-link

# Every pull request links its Linear ticket in the description; the
# template (`.github/pull_request_template.md`) has the line for it. The
# check reads only the event payload and needs no secrets, so it runs on
# `pull_request` with a read-only token. Like every check here it runs the
# PR's own copy of its script, so a PR that edits `.github/scripts/` can
# change it: review such a diff for that.
#
# `labeled` and `unlabeled` are here so adding or removing `no-ticket` re-runs
# the check without an edit to the description.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  ticket-link:
    name: Linear ticket link
    # Only the latest description counts. Scoped to this job, so an edit
    # never cancels a code change's script tests.
    concurrency:
      group: pr-ticket-link-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github
          persist-credentials: false
      - run: node .github/scripts/pr-ticket-link.mjs

  # The script's own tests, kept apart so a broken test never reads as a
  # missing link. Only a code change can break them, not an edit or a label.
  script-tests:
    name: Ticket link script tests
    if: github.event.action != 'edited' && github.event.action != 'labeled' && github.event.action != 'unlabeled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github
          persist-credentials: false
      - run: node --test .github/scripts/ticket-link.test.mjs
