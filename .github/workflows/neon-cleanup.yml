name: neon-cleanup

# Drops the merged PR's preview database. The Neon project caps its branch
# count, and nothing else deletes the `preview/<git-branch>` branches that
# client-v2/scripts/neon-preview-branch.sh creates.
on:
  pull_request:
    branches: ["master-2.0"]
    types: [closed]

permissions: {}

jobs:
  delete-preview-branch:
    name: delete preview branch
    # A fork's PR gets no secrets, and its branch never had a preview database.
    # Known limitation: a PR closed without merging keeps its branch; delete it by hand.
    if: github.event.pull_request.merged && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Same names as in client-v2/.env; see client-v2/docs/neon.md.
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      # Known limitation: neon-preview-branch.sh names the branch after the deployer's local
      # branch, so a preview deployed from a differently named local branch is not found.
      BRANCH: preview/${{ github.event.pull_request.head.ref }}
    steps:
      # The REST API rather than neonctl, whose flags change between the
      # weekly major releases. A PR that was never deployed has no branch, so
      # absence is a pass; any API error still fails the job.
      - name: Delete the Neon branch
        # Explicit `bash` adds pipefail, so a failed curl in `$(curl | jq)` fails the step.
        shell: bash
        run: |
          : "${NEON_API_KEY:?NEON_API_KEY secret is unset}"
          : "${NEON_PROJECT_ID:?NEON_PROJECT_ID variable is unset}"
          api=https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches
          auth="Authorization: Bearer $NEON_API_KEY"
          id=$(curl -fsS -G -H "$auth" --data-urlencode "search=$BRANCH" "$api" |
            jq -r --arg name "$BRANCH" '.branches[] | select(.name == $name) | .id')
          if [ -z "$id" ]; then
            echo "no Neon branch $BRANCH, nothing to delete"
            exit 0
          fi
          curl -fsS -X DELETE -H "$auth" "$api/$id" >/dev/null
          echo "deleted Neon branch $BRANCH ($id)"
