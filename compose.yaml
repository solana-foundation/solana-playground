# Local development only, not a production layout: production would need
# changes this project does not make.

name: "solana-playground"

# Built services name their image so another `COMPOSE_PROJECT_NAME` reuses it instead of rebuilding

x-client: &client
  platform: linux/amd64
  depends_on:
    wasm:
      condition: service_completed_successfully
    server:
      condition: service_started
  build:
    context: .
    dockerfile: ./client/Dockerfile
    args:
      USER: solpg
      HAS_SERVER: true
    additional_contexts:
      solana-playground-wasm: service:wasm
      solana-playground-server: service:server
  # The browser runs on the host, so it reaches the server through its published port
  environment:
    - REACT_APP_SERVER_URL=http://localhost:${PG_PORT:-8080}
  ports:
    - ${PG_CLIENT_PORT:-3000}:3000

x-client-v2: &client-v2
  platform: linux/amd64
  depends_on:
    wasm:
      condition: service_completed_successfully
    server-standalone:
      condition: service_started
    migrate:
      condition: service_completed_successfully
  build:
    context: .
    dockerfile: ./client-v2/Dockerfile
    args:
      USER: solpg
      HAS_SERVER: true
    additional_contexts:
      solana-playground-wasm: service:wasm
  # Secrets the user supplies; `environment` wins over this file for the keys it sets
  env_file:
    - path: client-v2/.env
      required: false
    - path: client-v2/.env.local
      required: false
  environment: &client-v2-environment
    DATABASE_URL: postgres://solpg:solpg@postgres:5432/solpg?sslmode=disable
    SYNC_ENABLED: "true"
    # The browser runs on the host, so it reaches the client and the build server through their published ports
    # The API accepts writes only from this origin (the local GitHub OAuth app calls back on 127.0.0.1); the shell's AUTH_BASE_URL overrides it
    AUTH_BASE_URL: ${AUTH_BASE_URL:-http://127.0.0.1:${PG_CLIENT_V2_PORT:-3000}}
    REACT_APP_SERVER_URL: http://localhost:${PG_PORT:-8080}
    # The dev server listens on 3000 inside; hot reload must dial the published port
    WDS_SOCKET_PORT: ${PG_CLIENT_V2_PORT:-3000}
  ports:
    - ${PG_CLIENT_V2_PORT:-3000}:3000

x-server: &server
  platform: linux/amd64
  build:
    context: ./server
    args:
      USER: solpg
  ports:
    - ${PG_PORT:-8080}:8080
  env_file: .env
  profiles:
    - dev
    - prod

services:
  client:
    <<: *client
    image: solana-playground-client
    tty: true
    stdin_open: true
    profiles:
      - dev

  client-prod:
    <<: *client
    image: solana-playground-client-prod
    command: ["sh", "-c", "yarn build && npx serve -s build"]
    profiles:
      - prod

  client-v2:
    <<: *client-v2
    image: solana-playground-client-v2
    tty: true
    stdin_open: true
    profiles:
      - v2

  client-v2-prod:
    <<: *client-v2
    image: solana-playground-client-v2-prod
    # The image carries prebuilt wasm/*/pkg and no Rust toolchain, which `yarn build` needs.
    # `serve-build.mjs` serves `api/*.mjs` too, which `npx serve` cannot.
    command:
      - sh
      - -c
      - >-
        yarn build:bundle &&
        node scripts/wasm-stubs.mjs check-build build &&
        exec node scripts/serve-build.mjs
    profiles:
      - v2-prod

  # Client without server
  client-standalone:
    image: solana-playground-client-standalone
    platform: linux/amd64
    depends_on:
      wasm:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: ./client/Dockerfile
      args:
        USER: solpg
        HAS_SERVER: ${PG_SERVER:-false}
      additional_contexts:
        solana-playground-wasm: service:wasm
    ports:
      - ${PG_CLIENT_PORT:-3000}:3000
    tty: true
    stdin_open: true
    profiles:
      - client-standalone

  # client-v2 without server
  client-v2-standalone:
    image: solana-playground-client-v2-standalone
    platform: linux/amd64
    depends_on:
      wasm:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: ./client-v2/Dockerfile
      args:
        USER: solpg
        HAS_SERVER: false
      additional_contexts:
        solana-playground-wasm: service:wasm
    # `.dockerignore` keeps client-v2/.env out of the image
    env_file:
      - path: client-v2/.env
        required: false
      - path: client-v2/.env.local
        required: false
    ports:
      - ${PG_CLIENT_V2_PORT:-3000}:3000
    tty: true
    stdin_open: true
    profiles:
      - client-v2-standalone

  client-v2-unstable:
    <<: *client-v2
    image: solana-playground-client-v2
    depends_on:
      wasm:
        condition: service_completed_successfully
      server-unstable:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    # A merge replaces the anchor's whole `environment`, so its keys come back through their own anchor
    environment:
      <<: *client-v2-environment
      REACT_APP_SERVER_UNSTABLE: "true"
    tty: true
    stdin_open: true
    profiles:
      - v2-unstable

  server:
    <<: *server
    image: solana-playground-server
    depends_on:
      - db
    environment:
      - PG_DB_URI=${PG_DB_URI:-mongodb://db:27017}

  # Server without DB. Publishes the same host port as `server`, so it is an
  # alternative to it rather than a companion -- no profile may start both.
  # client-v2 uses this one: MongoDB backs only the share routes, and the
  # server connects to it lazily.
  server-standalone:
    <<: *server
    image: solana-playground-server-standalone
    # Every setting has a default in server/src/config.rs
    env_file:
      - path: .env
        required: false
    profiles:
      - server-standalone
      - v2
      - v2-prod

  # The stock server image that server-unstable builds on, under its own name; `scale: 0` never runs it
  server-unstable-base:
    image: solana-playground-server-unstable-base
    platform: linux/amd64
    build:
      context: ./server
      args:
        USER: solpg
      # Built as a context of server-unstable, it ignores `platform` and builds for the host's architecture
      platforms:
        - linux/amd64
    scale: 0
    profiles:
      - v2-unstable

  # Local use only: the socket mount gives the container control of the host Docker daemon
  server-unstable:
    <<: *server
    image: solana-playground-server-unstable
    build:
      context: ./server
      dockerfile: ../docker/server-unstable.Dockerfile
      args:
        USER: solpg
      additional_contexts:
        server-image: service:server-unstable-base
    env_file:
      - path: .env
        required: false
    environment:
      # Anza publishes no arm64 Solana release for the program images
      DOCKER_DEFAULT_PLATFORM: linux/amd64
      PG_PORT: "8080" # the container port `ports` maps; a host PG_PORT in .env would move the listener off it
    group_add:
      - ${PG_DOCKER_GID:-0} # the socket's numeric group: 0 on Docker Desktop and OrbStack, `stat -c %g /var/run/docker.sock` on Linux
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Replaces templates/ whole, but only get_all_templates names are built: a missing one fails start-up, an added one is ignored
      - type: bind
        source: ${PG_SERVER_DIR:-./server}/templates
        target: /home/solpg/templates
        read_only: true
        bind:
          create_host_path: false
    profiles:
      - v2-unstable

  wasm:
    image: solana-playground-wasm
    platform: linux/amd64
    build:
      context: ./wasm
    profiles:
      - dev
      - prod
      - client-standalone
      - client-v2-standalone
      - v2
      - v2-prod
      - v2-unstable

  db:
    image: mongo:7
    volumes:
      - mongodb:/data/db
    # Override the default command because it logs a lot and setting `logging`
    # `driver` to `none` doesn't work
    command: mongod --quiet --logpath /dev/null
    profiles:
      - dev
      - prod

  # Conversation and project sync, read only by `client-v2/api/*.mjs`. Separate
  # from `db` on purpose: that one belongs to the Rust build server and is
  # upstream's, and this work does not touch it.
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: solpg
      POSTGRES_PASSWORD: solpg
      POSTGRES_DB: solpg
    ports:
      - ${PG_POSTGRES_PORT:-5432}:5432
    volumes:
      - postgres:/var/lib/postgresql/data
    # Over TCP: on the first start, initdb's temporary server answers on the socket only
    healthcheck:
      test:
        ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "solpg", "-d", "solpg"]
      interval: 2s
      timeout: 5s
      retries: 30
    profiles:
      - dev
      - prod
      - v2
      - v2-prod
      - v2-unstable

  # `yarn db-migrate` against the compose Postgres; the client-v2 services start once it exits 0
  migrate:
    image: amacneil/dbmate:2.35.1 # the version CI installs
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://solpg:solpg@postgres:5432/solpg?sslmode=disable
    volumes:
      - ./client-v2/db:/db:ro
    command: ["--migrations-dir", "/db/migrations", "--no-dump-schema", "up"]
    profiles:
      - v2
      - v2-prod
      - v2-unstable

volumes:
  mongodb:
  postgres:
