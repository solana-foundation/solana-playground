name: "solana-playground"

# Built services name their image so another `COMPOSE_PROJECT_NAME` reuses it instead of rebuilding

x-client: &client
  platform: linux/amd64
  depends_on:
    wasm:
      condition: service_completed_successfully
    server:
      condition: service_started
  build:
    context: .
    dockerfile: ./client/Dockerfile
    args:
      USER: solpg
      HAS_SERVER: true
    additional_contexts:
      solana-playground-wasm: service:wasm
      solana-playground-server: service:server
  # The browser runs on the host, so it reaches the server through its published port
  environment:
    - REACT_APP_SERVER_URL=http://localhost:${PG_PORT:-8080}
  ports:
    - ${PG_CLIENT_PORT:-3000}:3000

x-client-v2: &client-v2
  platform: linux/amd64
  depends_on:
    wasm:
      condition: service_completed_successfully
    server:
      condition: service_started
  build:
    context: .
    dockerfile: ./client-v2/Dockerfile
    args:
      USER: solpg
      HAS_SERVER: true
    additional_contexts:
      solana-playground-wasm: service:wasm
      solana-playground-server: service:server
  # The browser runs on the host, so it reaches the server through its published port
  environment:
    - REACT_APP_SERVER_URL=http://localhost:${PG_PORT:-8080}
  ports:
    - ${PG_CLIENT_V2_PORT:-3000}:3000

x-server: &server
  platform: linux/amd64
  build:
    context: ./server
    args:
      USER: solpg
  ports:
    - ${PG_PORT:-8080}:8080
  env_file: .env
  profiles:
    - dev
    - prod
    - v2
    - v2-prod

services:
  client:
    <<: *client
    image: solana-playground-client
    tty: true
    stdin_open: true
    profiles:
      - dev

  client-prod:
    <<: *client
    image: solana-playground-client-prod
    command: ["sh", "-c", "yarn build && npx serve -s build"]
    profiles:
      - prod

  client-v2:
    <<: *client-v2
    image: solana-playground-client-v2
    tty: true
    stdin_open: true
    profiles:
      - v2

  client-v2-prod:
    <<: *client-v2
    image: solana-playground-client-v2-prod
    # The image carries prebuilt wasm/*/pkg and no Rust toolchain, which `yarn build` needs
    command: ["sh", "-c", "yarn build:bundle && npx serve -s build"]
    profiles:
      - v2-prod

  # Client without server
  client-standalone:
    image: solana-playground-client-standalone
    platform: linux/amd64
    depends_on:
      wasm:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: ./client/Dockerfile
      args:
        USER: solpg
        HAS_SERVER: ${PG_SERVER:-false}
      additional_contexts:
        solana-playground-wasm: service:wasm
    ports:
      - ${PG_CLIENT_PORT:-3000}:3000
    tty: true
    stdin_open: true
    profiles:
      - client-standalone

  # client-v2 without server
  client-v2-standalone:
    image: solana-playground-client-v2-standalone
    platform: linux/amd64
    depends_on:
      wasm:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: ./client-v2/Dockerfile
      args:
        USER: solpg
        HAS_SERVER: false
      additional_contexts:
        solana-playground-wasm: service:wasm
    ports:
      - ${PG_CLIENT_V2_PORT:-3000}:3000
    tty: true
    stdin_open: true
    profiles:
      - client-v2-standalone

  server:
    <<: *server
    image: solana-playground-server
    depends_on:
      - db
    environment:
      - PG_DB_URI=${PG_DB_URI:-mongodb://db:27017}

  # Server without DB. Publishes the same host port as `server`, so it is an
  # alternative to it rather than a companion -- it must not inherit the
  # shared profiles, or every profile builds and starts the server twice.
  server-standalone:
    <<: *server
    image: solana-playground-server-standalone
    profiles:
      - server-standalone

  wasm:
    image: solana-playground-wasm
    platform: linux/amd64
    build:
      context: ./wasm
    profiles:
      - dev
      - prod
      - client-standalone
      - client-v2-standalone
      - v2
      - v2-prod

  db:
    image: mongo:7
    volumes:
      - mongodb:/data/db
    # Override the default command because it logs a lot and setting `logging`
    # `driver` to `none` doesn't work
    command: mongod --quiet --logpath /dev/null
    profiles:
      - dev
      - prod
      - v2
      - v2-prod

  # Conversation and project sync, read only by `client-v2/api/*.mjs`. Separate
  # from `db` on purpose: that one belongs to the Rust build server and is
  # upstream's, and this work does not touch it.
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: solpg
      POSTGRES_PASSWORD: solpg
      POSTGRES_DB: solpg
    ports:
      - ${PG_POSTGRES_PORT:-5432}:5432
    volumes:
      - postgres:/var/lib/postgresql/data
    profiles:
      - dev
      - prod
      - v2
      - v2-prod

volumes:
  mongodb:
  postgres:
