service: playground-server
runtime: custom
env: flex

automatic_scaling:
  min_num_instances: 1
  max_num_instances: 1

# Runtime configuration is supplied via GCP-managed env vars and/or secrets.
# Keep this file free of credentials so the manifest is safe to commit.
# PG_API_KEY, when set there, makes the build and deploy routes answer only a
# request whose x-api-key header matches: the client deployment's
# /api/build-server route, which holds the same value as PG_BUILD_SERVER_API_KEY.
env_variables:
  # Each cargo-build-sbf peaks ~3.7GB and ~1 core; sized with resources below for 3 concurrent builds, leaving 1 core for serving.
  PG_BUILD_CONCURRENCY: "3"
  # Prefix-matched against Origin (no trailing slashes). The `solana-playground-` prefix temporarily admits dynamic Vercel preview URLs and might be dropped later.
  PG_CLIENT_URLS: "https://beta.solpg.io,https://playground.solana.com,https://solana-playground-two.vercel.app,https://solana-playground-,http://localhost,http://127.0.0.1"

resources:
  cpu: 4
  memory_gb: 16
  disk_size_gb: 50
