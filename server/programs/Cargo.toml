[package]
name = "solpg"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
path = "default/src/lib.rs"

[profile.release]
overflow-checks = true
incremental = true

[dependencies]
anchor-lang = { version = "=1.1.2", features = ["allow-missing-optionals", "event-cpi", "init-if-needed", "lazy-account"] }
anchor-spl = { version = "=1.1.2", features = ["governance", "memo", "metadata"] }
borsh = { version = "=1.8.1", features = ["derive"] }
bytemuck = { version = "=1.25.2", features = ["derive", "min_const_generics"] }
solana-program = "=3.0.0"
spl-associated-token-account-interface = "=2.0.0"
spl-token-2022-interface = "=2.1.0"
spl-token-interface = "=2.0.0"

[lints.rust]
unexpected_cfgs = "allow"
